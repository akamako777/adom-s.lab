                                            <input type="number" className="border rounded p-2 w-16" value={d.count} min="1" onChange={e => updateCount(i, parseInt(e.target.value, 10))} />
                                        )}
                                        <Button variant="danger" onClick={() => setDuties(duties.filter((_, x) => x !== i))}><Icons.Trash /></Button>
                                    </div>
                                ))}
                                <Button variant="secondary" onClick={addJob} disabled={remainingSlots <= 0}><Icons.Plus /> 追加</Button>
                            </div>

                            <div className="bg-gray-50 p-4 rounded-lg border no-print">
                                <div className="flex flex-wrap gap-4 items-center mb-4">
                                    <label className="font-bold text-sm">期間:
                                        <select className="ml-2 border rounded p-1" value={data.dutyConfig.type} onChange={e => setData({ ...data, dutyConfig: { ...data.dutyConfig, type: e.target.value } })}>
                                            <option value="week">週交代</option><option value="month">月交代</option>
                                        </select>
                                    </label>
                                    <label className="font-bold text-sm">回数:
                                        <input type="number" className="ml-2 w-16 border rounded p-1" value={data.dutyConfig.duration} onChange={e => setData({ ...data, dutyConfig: { ...data.dutyConfig, duration: parseInt(e.target.value, 10) || 1 } })} />
                                    </label>
                                    <label className="font-bold text-sm">ずらす数:
                                        <input type="number" className="ml-2 w-16 border rounded p-1" value={shiftVal} onChange={e => { const v = parseInt(e.target.value, 10); setShiftVal(isNaN(v) ? 0 : v); }} />
                                    </label>
                                </div>
                                <div className="flex gap-2 flex-wrap">
                                    <Button onClick={() => generate('asc')} variant="secondary"><Icons.ArrowDown /> 名簿順（昇順）</Button>
                                    <Button onClick={() => generate('desc')} variant="secondary"><Icons.ArrowUp /> 逆順（降順）</Button>
                                    <Button onClick={() => generate('random')} variant="secondary"><Icons.Shuffle /> ランダム</Button>
                                </div>
                            </div>
                        </div>

                        {schedule.slots && (
                            <div className="mt-6">
                                <div className="flex justify-end gap-2 mb-2 no-print">
                                    <Button variant="secondary" onClick={doPrint}><Icons.Printer /> 印刷</Button>
                                    <Button variant="secondary" onClick={doExcel}><Icons.Download /> Excel</Button>
                                </div>
                                <div id="print-target" className="overflow-x-auto border rounded">
                                    <table className="w-full text-sm text-center border-collapse">
                                        <thead>
                                            <tr className="bg-gray-100">
                                                <th className="border p-2 min-w-[100px] bg-gray-200">係 \ 回</th>
                                                {schedule.weeks.map(w => (
                                                    <th key={w.id} className="border p-2 min-w-[60px]">{w.id}{data.dutyConfig.type === 'week' ? '週' : '月'}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {schedule.slots.map((slot, i) => (
                                                <tr key={i}>
                                                    <td className="border p-2 font-bold bg-gray-50 text-left px-4">{slot.name}</td>
                                                    {schedule.weeks.map(w => (
                                                        <td key={w.id} className="border p-2">{w.mapping[slot.id]}</td>
                                                    ))}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        // ==========================================
        // 9. グループ分けツール（修正②：名簿変更時の班メンバー最新化＆削除済み幽霊メンバー自動除外）
        // ==========================================
        const ClubTool = ({ data, setData, showToast }) => {
            const syncGroupsWithStudents = (rawGroups, students) => {
                const studentMap = new Map(students.map(s => [s.id, s]));
                return rawGroups.map(g => {
                    const seen = new Set();
                    const syncedMembers = [];
                    (g.members || []).forEach(m => {
                        const latest = studentMap.get(m.id);
                        if (latest && !seen.has(latest.id)) {
                            seen.add(latest.id);
                            syncedMembers.push(latest);
                        }
                    });
                    return { ...g, members: syncedMembers };
                });
            };

            const [groups, setGroups] = useState(() => {
                const base = data.clubConfig.clubs && data.clubConfig.clubs.length
                    ? data.clubConfig.clubs
                    : [{ id: 'g1', name: '班1', members: [] }];
                return syncGroupsWithStudents(base, data.students);
            });
            const [unassigned, setUnassigned] = useState([]);
            const [delGId, setDelGId] = useState(null);
            const [resetConfirm, setResetConfirm] = useState(false);
            const [lockedIds, setLockedIds] = useState(() => {
                const validIds = new Set(data.students.map(s => s.id));
                return new Set((data.clubConfig.lockedStudentIds || []).filter(id => validIds.has(id)));
            });

            // ★修正②：名簿(data.students)が追加・編集・削除された際に班メンバーとロックIDを自動同期
            useEffect(() => {
                const studentMap = new Map(data.students.map(s => [s.id, s]));
                setGroups(prevGroups => {
                    let changed = false;
                    const nextGroups = prevGroups.map(g => {
                        const seen = new Set();
                        const syncedMembers = [];
                        for (let i = 0; i < g.members.length; i++) {
                            const m = g.members[i];
                            const latest = studentMap.get(m.id);
                            if (!latest || seen.has(m.id)) {
                                changed = true;
                                continue;
                            }
                            seen.add(m.id);
                            if (
                                m.name !== latest.name ||
                                m.gender !== latest.gender ||
                                m.needsSupport !== latest.needsSupport ||
                                m.fixedSeat !== latest.fixedSeat ||
                                JSON.stringify(m.avoid || []) !== JSON.stringify(latest.avoid || [])
                            ) {
                                changed = true;
                            }
                            syncedMembers.push(latest);
                        }
                        return { ...g, members: syncedMembers };
                    });
                    return changed ? nextGroups : prevGroups;
                });

                setLockedIds(prevLocked => {
                    let changed = false;
                    const nextLocked = new Set();
                    prevLocked.forEach(id => {
                        if (studentMap.has(id)) nextLocked.add(id);
                        else changed = true;
                    });
                    return changed ? nextLocked : prevLocked;
                });
            }, [data.students]);

            useEffect(() => {
                const assigned = new Set();
                groups.forEach(g => g.members.forEach(m => assigned.add(m.id)));
                setUnassigned(data.students.filter(s => !assigned.has(s.id)));
            }, [data.students, groups]);

            useEffect(() => {
                setData(p => ({ ...p, clubConfig: { ...p.clubConfig, clubs: groups, lockedStudentIds: Array.from(lockedIds) } }));
            }, [groups, lockedIds]);

            const toggleLock = (e, sid) => {
                e.stopPropagation();
                const newLocked = new Set(lockedIds);
                if (newLocked.has(sid)) newLocked.delete(sid);
                else newLocked.add(sid);
                setLockedIds(newLocked);
            };

            const deleteGroup = () => {
                setGroups(groups.filter(x => x.id !== delGId));
                setDelGId(null);
                showToast('班を削除しました', 'success');
            };

            const resetAll = () => {
                setGroups([]);
                setLockedIds(new Set());
                setResetConfirm(false);
                showToast('全ての班をリセットしました', 'success');
            };

            const canAddGroup = unassigned.length > 0;
            const addGroup = () => {
                if (!canAddGroup) return;
                const newId = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
                setGroups([...groups, { id: newId, name: '班' + (groups.length + 1), members: [] }]);
            };

            const onDrag = (e, sid, gid) => {
                e.dataTransfer.setData('sid', sid);
                e.dataTransfer.setData('src', gid);
            };
            const onDrop = (e, dest) => {
                const sid = e.dataTransfer.getData('sid');
                const src = e.dataTransfer.getData('src');
                if (!sid) return;
                if (dest !== 'un') {
                    const destGroup = groups.find(g => g.id === dest);
                    if (destGroup && destGroup.members.some(m => m.id === sid)) return;
                }
                const student = data.students.find(s => s.id === sid);
                const newGroups = groups.map(g => ({ ...g, members: [...g.members] }));
                if (src !== 'un') {
                    const srcG = newGroups.find(g => g.id === src);
                    if (srcG) srcG.members = srcG.members.filter(m => m.id !== sid);
                }
                // ★修正②防御：万が一削除済みIDがドロップされた場合も元班からは確実に外す
                if (!student) {
                    setGroups(newGroups);
                    return;
                }
                if (dest !== 'un') {
                    const destG = newGroups.find(g => g.id === dest);
                    if (destG) destG.members.push(student);
                }
                setGroups(newGroups);
            };

            const autoAssign = (mode) => {
                if (groups.length === 0) return showToast('班を作ってください', 'error');
                const targets = unassigned.filter(s => !lockedIds.has(s.id));
                const baseGroups = groups.map(g => {
                    const locked = g.members.filter(m => lockedIds.has(m.id));
                    const unlocked = g.members.filter(m => !lockedIds.has(m.id));
                    targets.push(...unlocked);
                    return { ...g, members: locked };
                });
                if (targets.length === 0) return showToast('振り分ける対象の生徒がいません（全員固定されています）', 'warning');

                if (mode === 'random') {
                    let bestGroups = null;
                    let minConflicts = Infinity;
                    let bestScore = Infinity;
                    const shuffleArr = (arr) => {
                        const res = [...arr];
                        for (let i = res.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [res[i], res[j]] = [res[j], res[i]];
                        }
                        return res;
                    };

                    for (let k = 0; k < 500; k++) {
                        const boys = targets.filter(s => s.gender === 'boy');
                        const girls = targets.filter(s => s.gender === 'girl');
                        const mixed = targets.filter(s => s.gender !== 'boy' && s.gender !== 'girl');
                        const tempGroups = baseGroups.map(g => ({ ...g, members: [...g.members] }));
                        let currentConflicts = 0;

                        const assignToGroups = (students) => {
                            students.forEach(s => {
                                const minLen = Math.min(...tempGroups.map(g => g.members.length));
                                const candidates = tempGroups.filter(g => g.members.length === minLen);
                                const validCandidates = candidates.filter(g => !g.members.some(m => s.avoid.includes(m.id) || m.avoid.includes(s.id)));
                                let targetGroup;
                                if (validCandidates.length > 0) {
                                    targetGroup = validCandidates[Math.floor(Math.random() * validCandidates.length)];
                                } else {
                                    const allValid = tempGroups.filter(g => !g.members.some(m => s.avoid.includes(m.id) || m.avoid.includes(s.id)));
                                    if (allValid.length > 0) {
                                        const minV = Math.min(...allValid.map(g => g.members.length));
                                        const bestV = allValid.filter(g => g.members.length === minV);
                                        targetGroup = bestV[Math.floor(Math.random() * bestV.length)];
                                    } else {
                                        targetGroup = candidates[Math.floor(Math.random() * candidates.length)];
                                        currentConflicts++;
                                    }
                                }
                                targetGroup.members.push(s);
                            });
                        };

                        assignToGroups(shuffleArr(boys));
                        assignToGroups(shuffleArr(girls));
                        assignToGroups(shuffleArr(mixed));

                        const lengths = tempGroups.map(g => g.members.length);
                        const balancePenalty = Math.max(...lengths) - Math.min(...lengths);
                        const score = (currentConflicts * 1000) + balancePenalty;
                        if (score < bestScore) {
                            bestScore = score;
                            bestGroups = tempGroups;
                            minConflicts = currentConflicts;
                        }
                        if (currentConflicts === 0 && balancePenalty <= 1) break;
                    }
                    setGroups(bestGroups);
                    showToast(minConflicts === 0 ? '男女均等で最適な班分けができました！' : ('班分け完了（※NG条件を' + minConflicts + '件 解消できませんでした）'), minConflicts === 0 ? 'success' : 'warning');
                } else {
                    if (mode === 'desc') targets.reverse();
                    const newGroups = baseGroups.map(g => ({ ...g, members: [...g.members] }));
                    let gIdx = 0;
                    targets.forEach(s => {
                        let assigned = false;
                        const startIdx = gIdx;
                        for (let i = 0; i < newGroups.length; i++) {
                            const currentGIdx = (startIdx + i) % newGroups.length;
                            const group = newGroups[currentGIdx];
                            const hasConflict = group.members.some(m => s.avoid.includes(m.id) || m.avoid.includes(s.id));
                            const minMembers = Math.min(...newGroups.map(g => g.members.length));
                            if (!hasConflict && group.members.length <= minMembers + 1) {
                                group.members.push(s);
                                gIdx = (currentGIdx + 1) % newGroups.length;
                                assigned = true;
                                break;
                            }
                        }
                        if (!assigned) {
                            let minLen = Infinity, targetGIdx = 0;
                            newGroups.forEach((g, i) => { if (g.members.length < minLen) { minLen = g.members.length; targetGIdx = i; } });
                            newGroups[targetGIdx].members.push(s);
                        }
                    });
                    setGroups(newGroups);
                    showToast('順序通りに振り分けました', 'success');
                }
            };

            const doPrint = () => handlePrint('print-target', showToast);
            const doExcel = () => {
                const rows = [groups.map(g => g.name)];
                let maxLen = 0;
                groups.forEach(g => { if (g.members.length > maxLen) maxLen = g.members.length; });
                for (let i = 0; i < maxLen; i++) {
                    rows.push(groups.map(g => (g.members[i] ? g.members[i].name : '')));
                }
                const ws = XLSX.utils.aoa_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '班分け');
                XLSX.writeFile(wb, '班分け.xlsx');
                showToast('Excelファイルをダウンロードしました', 'success');
            };

            const renderStudent = (s, groupId, inGroup) => {
                const isLocked = lockedIds.has(s.id);
                const bgClass = inGroup
                    ? (s.gender === 'boy' ? 'bg-blue-100 border-blue-300 text-blue-900' : s.gender === 'girl' ? 'bg-red-100 border-red-300 text-red-900' : 'bg-blue-50 border-blue-100')
                    : (s.gender === 'boy' ? 'bg-blue-50 border-blue-200 text-blue-900' : s.gender === 'girl' ? 'bg-red-50 border-red-200 text-red-900' : 'bg-white border-transparent');
                return (
                    <div
                        key={s.id}
                        draggable={!isLocked}
                        onDragStart={e => onDrag(e, s.id, groupId)}
                        className={'relative pr-8 p-2 rounded shadow mb-2 text-sm border transition-all ' + bgClass + ' ' + (isLocked ? 'ring-2 ring-gray-500 font-bold opacity-90' : 'cursor-grab hover:opacity-80')}
                    >
                        <span className="truncate block">{s.name}</span>
                        <button onClick={(e) => toggleLock(e, s.id)} className={'absolute right-1 top-1/2 -translate-y-1/2 p-1.5 rounded-full hover:bg-gray-200 cursor-pointer ' + (isLocked ? 'text-gray-800' : 'text-gray-400')} title={isLocked ? '固定解除' : '班長として固定'}>
                            {isLocked ? <Icons.Lock size={14} /> : <Icons.Unlock size={14} />}
                        </button>
                    </div>
                );
            };

            return (
                <div className="space-y-4">
                    <ConfirmModal isOpen={!!delGId} onClose={() => setDelGId(null)} onConfirm={deleteGroup} message="班を削除しますか？メンバーは未所属に戻ります。" />
                    <ConfirmModal isOpen={resetConfirm} onClose={() => setResetConfirm(false)} onConfirm={resetAll} message="全ての班とロック設定を削除し、全員を未所属に戻しますか？" />
                    <Card title="グループ分け" action={
                        <div className="flex gap-2">
                            <Button variant="secondary" onClick={doPrint}><Icons.Printer /> 印刷</Button>
                            <Button variant="secondary" onClick={doExcel}><Icons.Download /> Excel</Button>
                        </div>
                    }>
                        <div className="no-print mb-4 p-4 bg-gray-50 rounded border flex flex-col gap-3">
                            <div className="flex gap-2 items-center">
                                <Button variant="secondary" onClick={addGroup} disabled={!canAddGroup}><Icons.Plus /> 班追加</Button>
                                <Button variant="danger" onClick={() => setResetConfirm(true)} disabled={groups.length === 0}><Icons.Trash /> 全削除</Button>
                            </div>
                            <div className="flex gap-2 items-center border-t pt-3">
                                <span className="text-sm font-bold text-gray-700">自動振り分け:</span>
                                <Button variant="ghost" className="text-xs" onClick={() => autoAssign('asc')} disabled={unassigned.length === 0 && lockedIds.size === data.students.length}>名簿順</Button>
                                <Button variant="ghost" className="text-xs" onClick={() => autoAssign('desc')} disabled={unassigned.length === 0 && lockedIds.size === data.students.length}>逆順</Button>
                                <Button variant="ghost" className="text-xs font-bold text-blue-600" onClick={() => autoAssign('random')} disabled={unassigned.length === 0 && lockedIds.size === data.students.length}><Icons.Shuffle size={16} /> ランダム（ガチャ）</Button>
                            </div>
                        </div>

                        <div id="print-target" className="flex gap-4 overflow-x-auto pb-4 min-h-[400px]">
                            <div className="min-w-[180px] bg-gray-100 p-4 rounded border-2 border-dashed no-print" onDragOver={e => e.preventDefault()} onDrop={e => onDrop(e, 'un')}>
                                <div className="font-bold text-gray-500 mb-2">未所属 ({unassigned.length})</div>
                                {unassigned.map(s => renderStudent(s, 'un', false))}
                            </div>
                            {groups.map(g => (
                                <div key={g.id} className="min-w-[180px] bg-white border p-4 rounded shadow-sm flex flex-col" onDragOver={e => e.preventDefault()} onDrop={e => onDrop(e, g.id)}>
                                    <input className="font-bold border-b mb-2 w-full focus:outline-none focus:border-blue-500" value={g.name} onChange={e => setGroups(groups.map(gx => gx.id === g.id ? { ...gx, name: e.target.value } : gx))} />
                                    <div className="flex-grow min-h-[50px]">{g.members.map(s => renderStudent(s, g.id, true))}</div>
                                    <div className="text-right mt-2 text-xs text-gray-400">{g.members.length}名</div>
                                    <button onClick={() => setDelGId(g.id)} className="text-red-300 text-right mt-1 no-print hover:text-red-500 cursor-pointer"><Icons.Trash size={16} /></button>
                                </div>
                            ))}
                        </div>
                    </Card>
                </div>
            );
        };

        // ==========================================
        // 10. 写真ツール
        // ==========================================
        const PhotoTool = ({ data, showToast, activeSlot }) => {
            const [photos, setPhotos] = useState({});
            const [stockPhotos, setStockPhotos] = useState([]);
            const [selectedStockIndex, setSelectedStockIndex] = useState(null);
            const [isDragging, setIsDragging] = useState(false);
            const [printCols, setPrintCols] = useState(8);
            const [printOrientation, setPrintOrientation] = useState('portrait');
            const [isLoaded, setIsLoaded] = useState(false);
            const [showClearConfirm, setShowClearConfirm] = useState(false);

            const [cameraTarget, setCameraTarget] = useState(null);
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            const MAX_STOCK = 100;
            const isNoStudents = data.students.length === 0;
            const registeredCount = data.students.filter(s => !!photos[s.id]).length;
            const isExportDisabled = isNoStudents || registeredCount === 0;

            useEffect(() => {
                const loadData = async () => {
                    setIsLoaded(false);
                    const savedPhotos = await loadFromDB('assignedPhotos_' + activeSlot);
                    const savedStock = await loadFromDB('stockPhotos_' + activeSlot);
                    setPhotos(savedPhotos || {});
                    setStockPhotos(savedStock || []);
                    setIsLoaded(true);
                };
                loadData();
                return () => {
                    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
                };
            }, [activeSlot]);

            useEffect(() => {
                if (isLoaded) saveToDB('assignedPhotos_' + activeSlot, photos);
            }, [photos, isLoaded, activeSlot]);

            useEffect(() => {
                if (isLoaded) saveToDB('stockPhotos_' + activeSlot, stockPhotos);
            }, [stockPhotos, isLoaded, activeSlot]);

            const processFiles = async (files) => {
                const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
                if (imageFiles.length === 0) return;
                const availableSlots = MAX_STOCK - stockPhotos.length;
                if (availableSlots <= 0) return showToast('ストックの上限(' + MAX_STOCK + '枚)に達しています', 'error');

                const filesToProcess = imageFiles.slice(0, availableSlots);
                showToast(filesToProcess.length + '枚の画像を軽量化して保存しています...', 'info');

                const newStocks = [];
                for (let i = 0; i < filesToProcess.length; i++) {
                    try {
                        const dataUrl = await resizeImage(filesToProcess[i], 1200);
                        newStocks.push(dataUrl);
                    } catch (e) {
                        console.error('画像リサイズエラー:', e);
                    }
                }
                setStockPhotos(prev => [...prev, ...newStocks]);
                showToast(newStocks.length + '枚を保存しました', 'success');
            };

            const onDropFiles = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files) processFiles(e.dataTransfer.files);
            };

            const handleFileSelect = (e) => {
                if (e.target.files) processFiles(e.target.files);
                e.target.value = '';
            };

            const handleDragStartStock = (e, index) => {
                e.dataTransfer.setData('stockIndex', index);
                setSelectedStockIndex(index);
            };

            const assignPhotoToStudent = (stockIndex, studentId) => {
                if (stockIndex < 0 || stockIndex >= stockPhotos.length) return;
                const photoData = stockPhotos[stockIndex];
                const oldPhoto = photos[studentId];
                const newStock = [...stockPhotos];
                newStock.splice(stockIndex, 1);
                if (oldPhoto) newStock.push(oldPhoto);
                setStockPhotos(newStock);
                setPhotos(prev => ({ ...prev, [studentId]: photoData }));
                setSelectedStockIndex(null);
            };

            const handleDropOnStudent = (e, studentId) => {
                e.preventDefault();
                const stockIndexStr = e.dataTransfer.getData('stockIndex');
                if (stockIndexStr === '') return;
                assignPhotoToStudent(parseInt(stockIndexStr, 10), studentId);
            };

            const removePhoto = (id) => {
                const oldPhoto = photos[id];
                if (!oldPhoto) return;
                const newPhotos = { ...photos };
                delete newPhotos[id];
                setPhotos(newPhotos);
                if (stockPhotos.length < MAX_STOCK) {
                    setStockPhotos(prev => [...prev, oldPhoto]);
                    showToast('写真を外しました', 'info');
                }
            };

            const rotatePhoto = async (id) => {
                if (!photos[id]) return;
                try {
                    const rotated = await rotateImage(photos[id]);
                    setPhotos(prev => ({ ...prev, [id]: rotated }));
                } catch (e) {
                    showToast('回転に失敗しました', 'error');
                }
            };

            const clearAllPhotos = async () => {
                setPhotos({});
                setStockPhotos([]);
                await saveToDB('assignedPhotos_' + activeSlot, {});
                await saveToDB('stockPhotos_' + activeSlot, []);
                setShowClearConfirm(false);
                showToast('現在の枠の写真データを削除しました', 'success');
            };

            const stopCameraStream = () => {
                if (videoRef.current) {
                    videoRef.current.srcObject = null;
                }
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(t => t.stop());
                    streamRef.current = null;
                }
            };

            useEffect(() => {
                if (!cameraTarget) {
                    stopCameraStream();
                    return;
                }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast('このブラウザではカメラを利用できません', 'error');
                    setCameraTarget(null);
                    return;
                }
                let cancelled = false;
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then((stream) => {
                        if (cancelled) {
                            stream.getTracks().forEach(t => t.stop());
                            return;
                        }
                        stopCameraStream();
                        streamRef.current = stream;
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                            videoRef.current.play().catch(() => {});
                        }
                    })
                    .catch(() => {
                        if (!cancelled) {
                            showToast('カメラの起動に失敗しました。権限を確認してください。', 'error');
                            setCameraTarget(null);
                        }
                    });
                return () => {
                    cancelled = true;
                    stopCameraStream();
                };
            }, [cameraTarget]);

            const openCamera = (studentId) => {
                setCameraTarget(studentId);
            };

            const takePhoto = () => {
                if (!videoRef.current || !cameraTarget) return;
                const video = videoRef.current;
                if (!video.videoWidth || !video.videoHeight) {
                    showToast('カメラ映像の準備中です。少し待ってから撮影してください。', 'info');
                    return;
                }
                const maxDim = 1200;
                let w = video.videoWidth;
                let h = video.videoHeight;
                if (w > maxDim || h > maxDim) {
                    if (w > h) {
                        h = Math.round((h * maxDim) / w);
                        w = maxDim;
                    } else {
                        w = Math.round((w * maxDim) / h);
                        h = maxDim;
                    }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(video, 0, 0, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                setPhotos(prev => ({ ...prev, [cameraTarget]: dataUrl }));
                closeCamera();
            };

            const closeCamera = () => {
                stopCameraStream();
                setCameraTarget(null);
            };

            const downloadZip = async () => {
                if (isExportDisabled) return;
                showToast('ZIPファイルを作成中です...', 'info');
                try {
                    const zip = new JSZip();
                    data.students.forEach((s, idx) => {
                        if (photos[s.id]) {
                            const blob = dataURLtoBlob(photos[s.id]);
                            const noStr = String(idx + 1).padStart(2, '0');
                            const prefix = data.settings.gradeClass ? (data.settings.gradeClass + '_') : '';
                            zip.file(prefix + noStr + '_' + s.name + '.jpg', blob);
                        }
                    });
                    const content = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'クラス写真_' + (data.settings.gradeClass || '未設定') + '.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('ZIPダウンロードが完了しました', 'success');
                } catch (err) {
                    showToast('ZIP作成中にエラーが発生しました', 'error');
                }
            };

            if (!isLoaded) return <div className="p-10 text-center text-gray-500 font-bold animate-pulse">写真データを読み込んでいます...</div>;

            return (
                <div className="space-y-6">
                    {cameraTarget && (
                        <div className="modal-overlay z-[3000]">
                            <div className="bg-black p-4 rounded-xl shadow-2xl">
                                <video ref={videoRef} autoPlay playsInline className="max-h-[70vh] rounded bg-gray-900 mx-auto" />
                                <div className="mt-4 flex justify-center gap-4">
                                    <Button variant="secondary" onClick={closeCamera}>キャンセル</Button>
                                    <Button variant="primary" onClick={takePhoto} className="px-8 py-3"><Icons.Camera /> 撮影する</Button>
                                </div>
                            </div>
                        </div>
                    )}
                    <ConfirmModal isOpen={showClearConfirm} onClose={() => setShowClearConfirm(false)} onConfirm={clearAllPhotos} message={'現在表示している「枠' + activeSlot + '」の写真データを消去します。\n本当によろしいですか？'} />

                    <div className="no-print">
                        <Card title={'1. 写真ストック (' + stockPhotos.length + '/' + MAX_STOCK + '枚)'} subtitle="画像をドロップしてストックし、下の名簿枠へドラッグ＆ドロップまたはタップして配置します。">
                            <div
                                className={'drop-zone p-6 rounded-xl text-center mb-4 cursor-pointer ' + (isDragging ? 'dragover' : 'bg-gray-50')}
                                onDragOver={e => { e.preventDefault(); setIsDragging(true); }}
                                onDragLeave={() => setIsDragging(false)}
                                onDrop={onDropFiles}
                                onClick={() => document.getElementById('fileUpload').click()}
                            >
                                <Icons.UploadCloud size={40} className="mx-auto text-blue-400 mb-2" />
                                <p className="font-bold text-gray-700">ここに複数枚の画像ファイルをドロップ</p>
                                <input id="fileUpload" type="file" multiple accept="image/*" className="hidden" onChange={handleFileSelect} />
                            </div>
                            {stockPhotos.length > 0 && (
                                <div className="p-3 bg-blue-50/50 rounded-lg border border-blue-100">
                                    <div className="flex gap-3 overflow-x-auto pb-2 p-1 min-h-[120px]">
                                        {stockPhotos.map((dataUrl, i) => (
                                            <div
                                                key={i}
                                                draggable
                                                onDragStart={(e) => handleDragStartStock(e, i)}
                                                onClick={() => setSelectedStockIndex(i === selectedStockIndex ? null : i)}
                                                className={'relative w-20 h-28 flex-shrink-0 cursor-grab rounded overflow-hidden border-2 transition-all ' + (selectedStockIndex === i ? 'border-blue-500 scale-105 shadow-md z-10' : 'border-gray-200')}
                                            >
                                                <img src={dataUrl} className="w-full h-full object-cover pointer-events-none" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </Card>
                    </div>

                    <Card
                        title="2. 児童の写真割り当て"
                        subtitle={isNoStudents ? '※名簿タブで生徒を登録してください' : 'プレビュー用グリッド'}
                        action={(!isNoStudents && (registeredCount > 0 || stockPhotos.length > 0)) && (
                            <Button variant="danger" className="text-xs py-1" onClick={() => setShowClearConfirm(true)}><Icons.Trash /> 写真リセット</Button>
                        )}
                    >
                        <div id="print-target" className="p-4 bg-white print:p-0">
                            <div className="photo-grid grid gap-4 grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8">
                                {data.students.map((s, idx) => {
                                    const hasPhoto = !!photos[s.id];
                                    const isTargetMode = selectedStockIndex !== null;
                                    return (
                                        <div
                                            key={s.id}
                                            className={'photo-card relative group flex flex-col h-full bg-white border rounded overflow-hidden shadow-sm transition-all ' + (isTargetMode ? 'ring-2 ring-blue-300 cursor-pointer hover:bg-blue-50' : 'border-gray-200')}
                                            onDragOver={e => e.preventDefault()}
                                            onDrop={e => handleDropOnStudent(e, s.id)}
                                            onClick={() => { if (selectedStockIndex !== null) assignPhotoToStudent(selectedStockIndex, s.id); }}
                                        >
                                            <div className="relative w-full pt-[133%] bg-gray-100 flex-shrink-0">
                                                {hasPhoto ? (
                                                    <img src={photos[s.id]} alt={s.name} className="absolute top-0 left-0 w-full h-full object-cover" />
                                                ) : (
                                                    <div className="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center text-gray-300">
                                                        <Icons.Image size={32} />
                                                    </div>
                                                )}
                                                <div className="no-print absolute top-0 left-0 w-full h-full bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-2">
                                                    {!hasPhoto ? (
                                                        <button onClick={(e) => { e.stopPropagation(); openCamera(s.id); }} className="bg-white p-2 rounded-full text-blue-600 cursor-pointer"><Icons.Camera size={20} /></button>
                                                    ) : (
                                                        <>
                                                            <button onClick={(e) => { e.stopPropagation(); rotatePhoto(s.id); }} className="bg-white p-2 rounded-full text-gray-700 cursor-pointer" title="90度回転"><Icons.RotateCw size={20} /></button>
                                                            <button onClick={(e) => { e.stopPropagation(); removePhoto(s.id); }} className="bg-white p-2 rounded-full text-red-500 cursor-pointer" title="外す"><Icons.Trash size={20} /></button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="p-2 text-center border-t bg-gray-50 flex-grow flex flex-col justify-center">
                                                <div className="photo-no">{idx + 1}</div>
                                                <div className="photo-name text-gray-800 leading-tight">{s.name || '未設定'}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="no-print sticky bottom-4 mt-8 bg-white border shadow-xl p-4 rounded-xl flex flex-wrap justify-between items-center gap-4 z-40">
                            <div className="text-sm text-gray-600 font-bold">登録済み: {registeredCount} / {data.students.length}名</div>
                            <div className="flex flex-wrap items-center gap-3">
                                <select
                                    className="border rounded text-sm p-1.5 font-bold"
                                    value={printOrientation + '-' + printCols}
                                    onChange={e => {
                                        const parts = e.target.value.split('-');
                                        setPrintOrientation(parts[0]);
                                        setPrintCols(parseInt(parts[1], 10));
                                    }}
                                >
                                    <optgroup label="縦向き (A4)">
                                        <option value="portrait-4">縦 4列</option>
                                        <option value="portrait-6">縦 6列</option>
                                        <option value="portrait-8">縦 8列</option>
                                        <option value="portrait-12">縦 12列</option>
                                    </optgroup>
                                    <optgroup label="横向き (A4)">
                                        <option value="landscape-4">横 4列</option>
                                        <option value="landscape-6">横 6列</option>
                                        <option value="landscape-8">横 8列</option>
                                        <option value="landscape-12">横 12列</option>
                                    </optgroup>
                                </select>
                                <Button variant="secondary" onClick={() => handlePrint('print-target', showToast, { isPhotoPrint: true, orientation: printOrientation, printCols })} disabled={isExportDisabled}><Icons.Printer /> PDF(印刷)作成</Button>
                                <Button variant="primary" onClick={downloadZip} disabled={isExportDisabled}><Icons.Download /> まとめてZIP保存</Button>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        // ==========================================
        // 11. 毎日の健康観察・GAS連携ツール
        // ==========================================
        const HealthCheckTool = ({ data, setData, activeSlot, showToast, isKioskMode, setIsKioskMode, onExitKiosk }) => {
            const healthConfig = normalizeHealthConfig(data.healthConfig);
            const allQuestions = healthConfig.questions;
            const activeQuestions = allQuestions.filter(q => q.enabled);

            const [todayStr, setTodayStr] = useState(() => getTodayJST());
            const [subTab, setSubTab] = useState('input');
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [step, setStep] = useState(0);
            const [answersMap, setAnswersMap] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [alreadyDoneModal, setAlreadyDoneModal] = useState(null);
            const [passModalMode, setPassModalMode] = useState(null);
            const [resetDefaultConfirm, setResetDefaultConfirm] = useState(false);
            const [showGuide, setShowGuide] = useState(false);
            const [showGasCode, setShowGasCode] = useState(false);
            const [isTestingGas, setIsTestingGas] = useState(false);

            const stepTimerRef = useRef(null);
            const autoBackTimerRef = useRef(null);

            const clearStepTimer = () => {
                if (stepTimerRef.current) {
                    clearTimeout(stepTimerRef.current);
                    stepTimerRef.current = null;
                }
            };
            const clearAutoBackTimer = () => {
                if (autoBackTimerRef.current) {
                    clearTimeout(autoBackTimerRef.current);
                    autoBackTimerRef.current = null;
                }
            };

            const dailyStorageKey = 'classToolHealthDaily_' + activeSlot;
            const loadDailyStore = (targetDate) => {
                try {
                    const raw = localStorage.getItem(dailyStorageKey);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && parsed.date === targetDate && parsed.records) {
                            return parsed;
                        }
                    }
                } catch (e) {}
                return { date: targetDate, records: {} };
            };

            const [dailyStore, setDailyStore] = useState(() => loadDailyStore(todayStr));

            useEffect(() => {
                try {
                    localStorage.setItem(dailyStorageKey, JSON.stringify(dailyStore));
                } catch (e) {}
            }, [dailyStore, dailyStorageKey]);

            const checkDateRollover = useCallback(() => {
                const nowDate = getTodayJST();
                if (nowDate !== todayStr) {
                    setTodayStr(nowDate);
                    setDailyStore(loadDailyStore(nowDate));
                    clearStepTimer();
                    clearAutoBackTimer();
                    setSelectedStudent(null);
                    setStep(0);
                    setAnswersMap({});
                    setAlreadyDoneModal(null);
                }
                return nowDate;
            }, [todayStr, dailyStorageKey]);

            useEffect(() => {
                const timer = setInterval(checkDateRollover, 30000);
                const onVisible = () => {
                    if (document.visibilityState === 'visible') checkDateRollover();
                };
                window.addEventListener('focus', checkDateRollover);
                document.addEventListener('visibilitychange', onVisible);
                return () => {
                    clearInterval(timer);
                    window.removeEventListener('focus', checkDateRollover);
                    document.removeEventListener('visibilitychange', onVisible);
                    clearStepTimer();
                    clearAutoBackTimer();
                };
            }, [checkDateRollover]);

            useEffect(() => {
                if (subTab !== 'input') {
                    clearStepTimer();
                    clearAutoBackTimer();
                    setSelectedStudent(null);
                    setStep(0);
                    setAnswersMap({});
                    setAlreadyDoneModal(null);
                }
            }, [subTab]);

            const updateHealthConfig = (updater) => {
                setData(prev => {
                    const current = normalizeHealthConfig(prev.healthConfig);
                    const next = typeof updater === 'function' ? updater(current) : { ...current, ...updater };
                    return { ...prev, healthConfig: normalizeHealthConfig(next) };
                });
            };

            const updateQuestions = (updater) => {
                updateHealthConfig(cfg => {
                    const copy = cfg.questions.map(q => ({
                        ...q,
                        options: q.options.map(o => ({ ...o }))
                    }));
                    const updated = updater(copy);
                    return { ...cfg, questions: updated };
                });
            };

            const sendToGas = async (url, payload) => {
                const trimmed = (url || '').trim();
                if (!trimmed) return { ok: false, skipped: true, reason: 'URL未設定' };
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);
                try {
                    const res = await fetch(trimmed, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    if (!res.ok) {
                        return { ok: false, reason: 'HTTP ' + res.status };
                    }
                    const text = await res.text();
                    let json = null;
                    try {
                        json = JSON.parse(text);
                    } catch (parseErr) {
                        return { ok: false, reason: 'GASからの応答がJSONではありません（URL・デプロイ権限「全員」を確認してください）' };
                    }
                    if (!json || json.status !== 'ok') {
                        return { ok: false, reason: (json && json.message) ? json.message : 'GAS側で処理が完了しませんでした' };
                    }
                    return { ok: true };
                } catch (err) {
                    clearTimeout(timeoutId);
                    const msg = err && err.name === 'AbortError' ? '通信タイムアウト(20秒)' : String(err && err.message ? err.message : err);
                    return { ok: false, reason: msg };
                }
            };

            const handleSelectStudent = (student, index) => {
                const latestDate = checkDateRollover();
                const currentStore = latestDate !== dailyStore.date ? loadDailyStore(latestDate) : dailyStore;
                if (currentStore.records[student.id]) {
                    setAlreadyDoneModal({ student, index });
                    return;
                }
                clearStepTimer();
                clearAutoBackTimer();
                setSelectedStudent({ student, index });
                setAnswersMap({});
                setStep(1);
            };

            const handleFinalSubmit = async (finalAnswersMap) => {
                if (!selectedStudent || isSubmitting) return;
                setIsSubmitting(true);
                const nowIso = new Date().toISOString();
                const currentDate = getTodayJST();
                if (currentDate !== todayStr) {
                    setTodayStr(currentDate);
                }

                const answersList = activeQuestions.map(q => {
                    const val = finalAnswersMap[q.id];
                    return val !== undefined ? String(val) : '';
                });
                const questionsMeta = activeQuestions.map((q, i) => (q.title && q.title.trim() ? q.title.trim() : ('しつもん' + (i + 1))));

                let hasWarning = false;
                activeQuestions.forEach(q => {
                    const picked = finalAnswersMap[q.id];
                    const matched = q.options.find((o, oi) => {
                        const lb = (o.label && String(o.label).trim()) ? String(o.label) : ('選択肢' + (oi + 1));
                        const ev = (o.value && String(o.value).trim()) ? String(o.value) : lb;
                        return ev === picked || lb === picked;
                    });
                    if (matched && matched.warn) hasWarning = true;
                });

                const payload = {
                    date: currentDate,
                    studentId: selectedStudent.student.id,
                    studentNo: selectedStudent.index + 1,
                    studentName: selectedStudent.student.name || ('児童' + (selectedStudent.index + 1)),
                    gradeClass: data.settings.gradeClass || '',
                    hasWarning,
                    answersList,
                    questionsMeta
                };

                let synced = false;
                let syncError = '';
                if ((healthConfig.gasUrl || '').trim()) {
                    const res = await sendToGas(healthConfig.gasUrl, payload);
                    synced = res.ok;
                    if (!res.ok) syncError = res.reason || '送信失敗';
                }

                setDailyStore(prev => {
                    const base = prev.date === currentDate ? prev : { date: currentDate, records: {} };
                    return {
                        date: currentDate,
                        records: {
                            ...base.records,
                            [selectedStudent.student.id]: {
                                studentId: selectedStudent.student.id,
                                studentNo: selectedStudent.index + 1,
                                studentName: payload.studentName,
                                time: formatTimeJST(nowIso),
                                hasWarning,
                                answersMap: { ...finalAnswersMap },
                                answersList,
                                synced,
                                syncError
                            }
                        }
                    };
                });

                setIsSubmitting(false);
                setStep(activeQuestions.length + 1);

                clearAutoBackTimer();
                autoBackTimerRef.current = setTimeout(() => {
                    setSelectedStudent(null);
                    setStep(0);
                    setAnswersMap({});
                }, 2200);
            };

            const handleAnswerTap = (question, option, optionIndex) => {
                if (isSubmitting) return;
                clearStepTimer();
                const fallbackText = '選択肢' + (optionIndex + 1);
                const optValue = (option.value !== undefined && String(option.value).trim() !== '')
                    ? String(option.value)
                    : ((option.label !== undefined && String(option.label).trim() !== '') ? String(option.label) : fallbackText);
                const nextMap = { ...answersMap, [question.id]: optValue };
                setAnswersMap(nextMap);

                stepTimerRef.current = setTimeout(() => {
                    stepTimerRef.current = null;
                    if (step < activeQuestions.length) {
                        setStep(prev => prev + 1);
                    } else {
                        handleFinalSubmit(nextMap);
                    }
                }, 140);
            };

            const handleBackStep = () => {
                clearStepTimer();
                clearAutoBackTimer();
                if (step <= 1) {
                    setSelectedStudent(null);
                    setStep(0);
                    setAnswersMap({});
                } else {
                    setStep(prev => prev - 1);
                }
            };

            const handleResendUnsynced = async () => {
                if (!(healthConfig.gasUrl || '').trim()) {
                    showToast('先に「GAS連携・質問設定」でURLを登録してください', 'error');
                    return;
                }
                const validIds = new Set(data.students.map(s => s.id));
                const unsyncedList = Object.values(dailyStore.records).filter(r => validIds.has(r.studentId) && !r.synced);
                if (unsyncedList.length === 0) {
                    showToast('未送信のデータはありません', 'info');
                    return;
                }
                showToast(unsyncedList.length + '件を再送信しています...', 'info');
                let okCount = 0;
                const updatedRecords = { ...dailyStore.records };
                const questionsMeta = activeQuestions.map((q, i) => (q.title && q.title.trim() ? q.title.trim() : ('しつもん' + (i + 1))));

                for (let i = 0; i < unsyncedList.length; i++) {
                    const rec = unsyncedList[i];
                    const rebuiltAnswers = rec.answersMap
                        ? activeQuestions.map(q => (rec.answersMap[q.id] !== undefined ? String(rec.answersMap[q.id]) : ''))
                        : (rec.answersList || []);
                    const payload = {
                        date: dailyStore.date,
                        studentId: rec.studentId,
                        studentNo: rec.studentNo,
                        studentName: rec.studentName,
                        gradeClass: data.settings.gradeClass || '',
                        hasWarning: !!rec.hasWarning,
                        answersList: rebuiltAnswers,
                        questionsMeta
                    };
                    const res = await sendToGas(healthConfig.gasUrl, payload);
                    if (res.ok) {
                        okCount++;
                        updatedRecords[rec.studentId] = { ...rec, answersList: rebuiltAnswers, synced: true, syncError: '' };
                    } else {
                        updatedRecords[rec.studentId] = { ...rec, syncError: res.reason || '送信失敗' };
                    }
                }
                setDailyStore(prev => ({ ...prev, records: updatedRecords }));
                showToast(okCount + ' / ' + unsyncedList.length + '件をスプレッドシートへ送信しました', okCount === unsyncedList.length ? 'success' : 'warning');
            };

            const handleAddPresetQuestion = (presetKey) => {
                if (healthConfig.isLocked) return;
                if (allQuestions.length >= MAX_HEALTH_QUESTIONS) {
                    showToast('質問は最大' + MAX_HEALTH_QUESTIONS + '問までです', 'warning');
                    return;
                }
                updateQuestions(list => [...list, clonePreset(presetKey)]);
                showToast('質問を追加しました', 'success');
            };

            const handleAddBlankQuestion = () => {
                if (healthConfig.isLocked) return;
                if (allQuestions.length >= MAX_HEALTH_QUESTIONS) {
                    showToast('質問は最大' + MAX_HEALTH_QUESTIONS + '問までです', 'warning');
                    return;
                }
                const n = allQuestions.length + 1;
                updateQuestions(list => [
                    ...list,
                    {
                        id: 'q_custom_' + Date.now().toString(36),
                        enabled: true,
                        title: 'あたらしい しつもん' + n,
                        artType: 'choice',
                        options: [
                            { value: 'はい', label: 'はい', sub: '', warn: false },
                            { value: 'いいえ', label: 'いいえ', sub: '', warn: false }
                        ]
                    }
                ]);
                showToast('新しい質問枠を追加しました', 'success');
            };

            const handleMoveQuestion = (idx, dir) => {
                if (healthConfig.isLocked) return;
                const target = idx + dir;
                if (target < 0 || target >= allQuestions.length) return;
                updateQuestions(list => {
                    const tmp = list[idx];
                    list[idx] = list[target];
                    list[target] = tmp;
                    return list;
                });
            };

            const handleDeleteQuestion = (idx) => {
                if (healthConfig.isLocked || allQuestions.length <= 1) return;
                updateQuestions(list => {
                    list.splice(idx, 1);
                    if (!list.some(q => q.enabled) && list.length > 0) {
                        list[0].enabled = true;
                    }
                    return list;
                });
                showToast('質問を削除しました', 'info');
            };

            const handleToggleQuestionEnabled = (idx, checked) => {
                if (healthConfig.isLocked) return;
                if (!checked && activeQuestions.length <= 1 && allQuestions[idx].enabled) {
                    showToast('子ども画面には最低1問は表示する必要があります', 'warning');
                    return;
                }
                updateQuestions(list => {
                    list[idx].enabled = checked;
                    return list;
                });
            };

            const handleResetQuestionsToDefault = () => {
                updateHealthConfig(cfg => ({ ...cfg, questions: createDefaultQuestions() }));
                showToast('質問を初期の4問に戻しました', 'success');
            };

            const handlePasswordConfirm = (inputPass) => {
                const input = String(inputPass);
                if (passModalMode === 'lockSettings') {
                    updateHealthConfig(cfg => ({ ...cfg, isLocked: true, lockPass: input }));
                    showToast('URL・質問設定をロックしました', 'success');
                } else if (passModalMode === 'unlockSettings') {
                    if (input === String(healthConfig.lockPass)) {
                        updateHealthConfig(cfg => ({ ...cfg, isLocked: false }));
                        showToast('設定ロックを解除しました', 'success');
                    } else {
                        showToast('パスワードが違います', 'error');
                        return;
                    }
                } else if (passModalMode === 'enterKiosk') {
                    updateHealthConfig(cfg => ({ ...cfg, isLocked: true, lockPass: input }));
                    setIsKioskMode(true);
                    setSubTab('input');
                    showToast('児童入力モード（画面ロック）を開始しました', 'success');
                } else if (passModalMode === 'exitKiosk') {
                    if (!healthConfig.lockPass || input === String(healthConfig.lockPass)) {
                        if (onExitKiosk) onExitKiosk();
                        else setIsKioskMode(false);
                        showToast('先生用メニューへ戻りました', 'success');
                    } else {
                        showToast('パスワードが違います', 'error');
                        return;
                    }
                } else if (passModalMode === 'resetPass') {
                    if (!healthConfig.lockPass || input === String(healthConfig.lockPass)) {
                        updateHealthConfig(cfg => ({ ...cfg, isLocked: false, lockPass: null }));
                        showToast('パスワードを解除しました。次回ロックまたは児童入力モード開始時に新しく設定できます。', 'success');
                    } else {
                        showToast('パスワードが違います', 'error');
                        return;
                    }
                }
                setPassModalMode(null);
            };

            const handleStartKioskClick = () => {
                if (data.students.length === 0) {
                    showToast('先に「名簿」タブで児童を登録してください', 'error');
                    return;
                }
                if (healthConfig.lockPass) {
                    updateHealthConfig(cfg => ({ ...cfg, isLocked: true }));
                    setIsKioskMode(true);
                    setSubTab('input');
                    showToast('児童入力モードを開始しました（既存パスワードで保護中）', 'success');
                } else {
                    setPassModalMode('enterKiosk');
                }
            };

            const handleCopyGasCode = () => {
                const ok = copyTextSafe(GAS_CODE_TEMPLATE);
                showToast(ok ? 'GASコードをクリップボードにコピーしました！' : 'コピーに失敗しました。コード欄を手動で選択してください', ok ? 'success' : 'error');
            };

            const handleTestGasConnection = async () => {
                if (!(healthConfig.gasUrl || '').trim()) {
                    showToast('デプロイしたGASのURLを入力してください', 'error');
                    return;
                }
                setIsTestingGas(true);
                const res = await sendToGas(healthConfig.gasUrl, { action: 'ping' });
                setIsTestingGas(false);
                if (res.ok) {
                    showToast('GASとの接続テストに成功しました！', 'success');
                } else {
                    showToast('接続失敗: ' + (res.reason || 'URLとデプロイ権限を確認してください'), 'error');
                }
            };

            const doneCount = data.students.filter(s => !!dailyStore.records[s.id]).length;
            const warnCount = data.students.filter(s => dailyStore.records[s.id] && dailyStore.records[s.id].hasWarning).length;
            const unsyncedCount = data.students.filter(s => dailyStore.records[s.id] && !dailyStore.records[s.id].synced).length;

            const renderKidInputView = () => {
                if (data.students.length === 0) {
                    return (
                        <div className="bg-white rounded-3xl p-10 text-center shadow-lg border-2 border-sky-200">
                            <p className="text-xl font-bold text-gray-700 mb-2">まだ児童名簿が登録されていません</p>
                            <p className="text-sm text-gray-500">「名簿」タブからクラスの子どもたちを登録すると、ここに名前ボタンが並びます。</p>
                        </div>
                    );
                }

                if (selectedStudent && step === activeQuestions.length + 1) {
                    return (
                        <div className="bg-white rounded-3xl p-8 sm:p-12 shadow-xl border-4 border-emerald-300 text-center max-w-2xl mx-auto animate-fade-in">
                            <div className="w-24 h-24 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
                                <Icons.CheckCircle size={56} />
                            </div>
                            <h2 className="text-3xl sm:text-4xl font-black text-emerald-700 mb-3">
                                {selectedStudent.student.name} さん<br />ありがとう！
                            </h2>
                            <p className="text-lg font-bold text-gray-600 mb-6">きょうの けんこうかんさつ が おわったよ！</p>
                            <button
                                onClick={() => {
                                    clearAutoBackTimer();
                                    setSelectedStudent(null);
                                    setStep(0);
                                    setAnswersMap({});
                                }}
                                className="px-8 py-4 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-black text-xl shadow-md cursor-pointer"
                            >
                                つぎの 人へ もどる
                            </button>
                        </div>
                    );
                }

                if (selectedStudent && step >= 1 && step <= activeQuestions.length) {
                    const currentQ = activeQuestions[step - 1];
                    const displayTitle = (currentQ.title && currentQ.title.trim()) ? currentQ.title : ('しつもん ' + step);
                    const optLen = currentQ.options.length;
                    const gridColsClass = optLen <= 2
                        ? 'grid-cols-1 sm:grid-cols-2 max-w-3xl mx-auto'
                        : optLen === 3
                            ? 'grid-cols-1 sm:grid-cols-3'
                            : optLen === 4
                                ? 'grid-cols-1 sm:grid-cols-2 max-w-4xl mx-auto'
                                : 'grid-cols-2 sm:grid-cols-3';

                    return (
                        <div className="bg-white rounded-3xl p-5 sm:p-8 shadow-xl border-4 border-sky-200 animate-fade-in">
                            <div className="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b-2 border-sky-100">
                                <button
                                    onClick={handleBackStep}
                                    disabled={isSubmitting}
                                    className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-black text-base flex items-center gap-1.5 cursor-pointer"
                                >
                                    <Icons.ArrowLeft size={20} /> もどる
                                </button>
                                <div className="text-center">
                                    <span className="inline-block bg-sky-100 text-sky-800 px-3 py-1 rounded-full font-black text-sm sm:text-base">
                                        {selectedStudent.index + 1}ばん {selectedStudent.student.name} さん
                                    </span>
                                </div>
                                <div className="font-black text-sky-700 text-base">
                                    しつもん {step} / {activeQuestions.length}
                                </div>
                            </div>

                            <div className="w-full bg-sky-100 rounded-full h-3 mb-6 overflow-hidden">
                                <div
                                    className="bg-emerald-500 h-3 rounded-full transition-all duration-300"
                                    style={{ width: Math.round((step / activeQuestions.length) * 100) + '%' }}
                                />
                            </div>

                            <h2 className="text-2xl sm:text-3xl font-black text-center text-gray-800 mb-6 leading-snug">
                                {displayTitle}
                            </h2>

                            {isSubmitting ? (
                                <div className="py-16 text-center font-black text-2xl text-sky-600 animate-pulse">
                                    そうしんちゅう… すこし まってね！
                                </div>
                            ) : (
                                <div className={'grid gap-4 ' + gridColsClass}>
                                    {currentQ.options.map((opt, oi) => {
                                        const labelText = (opt.label && opt.label.trim()) ? opt.label : ('選択肢' + (oi + 1));
                                        const effectiveVal = (opt.value && String(opt.value).trim()) ? String(opt.value) : labelText;
                                        const isPicked = answersMap[currentQ.id] === effectiveVal;
                                        return (
                                            <button
                                                key={oi}
                                                type="button"
                                                onClick={() => handleAnswerTap(currentQ, opt, oi)}
                                                className={'kid-tap-card rounded-2xl p-5 sm:p-6 border-4 flex flex-col items-center justify-center gap-2 text-center shadow-md cursor-pointer min-h-[140px] ' +
                                                    (isPicked ? 'bg-sky-50 border-sky-500 ring-4 ring-sky-200' : 'bg-white border-slate-200 hover:border-sky-400 hover:bg-sky-50/40')}
                                            >
                                                <HealthCardArt artType={currentQ.artType} optionIndex={oi} />
                                                <div className="text-xl sm:text-2xl font-black text-gray-800 leading-tight mt-1">{labelText}</div>
                                                {opt.sub && <div className="text-sm font-bold text-gray-500">{opt.sub}</div>}
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    );
                }

                return (
                    <div className="bg-white rounded-3xl p-5 sm:p-8 shadow-xl border-4 border-sky-200">
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b-2 border-sky-100">
                            <div>
                                <div className="text-sm font-black text-sky-600">{todayStr}（きょうの にゅうりょく）</div>
                                <h2 className="text-2xl sm:text-3xl font-black text-gray-800">じぶんの なまえを おしてね！</h2>
                            </div>
                            <div className="bg-emerald-50 border-2 border-emerald-200 px-4 py-2 rounded-2xl text-emerald-800 font-black text-base sm:text-lg">
                                おわった人: {doneCount} / {data.students.length}にん
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
                            {data.students.map((s, idx) => {
                                const done = !!dailyStore.records[s.id];
                                return (
                                    <button
                                        key={s.id}
                                        type="button"
                                        onClick={() => handleSelectStudent(s, idx)}
                                        className={'kid-tap-card relative rounded-2xl p-4 text-left shadow-sm cursor-pointer min-h-[76px] flex flex-col justify-center ' +
                                            (done
                                                ? 'bg-emerald-50 border-2 border-emerald-400 text-emerald-900'
                                                : 'bg-white border-2 border-sky-200 hover:border-sky-500 hover:bg-sky-50 text-gray-800')}
                                    >
                                        <div className="flex items-center justify-between mb-1">
                                            <span className="text-xs font-black text-gray-400">{idx + 1}ばん</span>
                                            {done && (
                                                <span className="bg-emerald-500 text-white text-xs font-black px-2 py-0.5 rounded-full flex items-center gap-0.5">
                                                    <Icons.Check size={12} /> 済
                                                </span>
                                            )}
                                        </div>
                                        <div className="text-lg sm:text-xl font-black truncate">{s.name || ('児童' + (idx + 1))}</div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const renderTodayCheckView = () => (
                <Card
                    title={'本日の健康観察チェック（' + todayStr + '）'}
                    subtitle={'回答済み: ' + doneCount + ' / ' + data.students.length + '名 ｜ 要確認: ' + warnCount + '名'}
                    action={
                        <div className="flex flex-wrap gap-2">
                            {unsyncedCount > 0 && (
                                <Button variant="warning" onClick={handleResendUnsynced}>
                                    <Icons.Send size={16} /> 未送信 {unsyncedCount}件を再送
                                </Button>
                            )}
                            <Button variant="secondary" onClick={() => handlePrint('health-today-print', showToast, { orientation: 'landscape' })}>
                                <Icons.Printer size={16} /> 印刷
                            </Button>
                        </div>
                    }
                >
                    <div id="health-today-print" className="overflow-x-auto">
                        <table className="w-full text-sm border-collapse">
                            <thead>
                                <tr className="bg-slate-100 text-slate-700">
                                    <th className="border p-2 w-12">No.</th>
                                    <th className="border p-2 min-w-[110px] text-left">氏名</th>
                                    <th className="border p-2 w-16">状態</th>
                                    {activeQuestions.map((q, i) => (
                                        <th key={q.id} className="border p-2 min-w-[110px] text-left text-xs">
                                            Q{i + 1}: {(q.title || '').slice(0, 14)}
                                        </th>
                                    ))}
                                    <th className="border p-2 w-20 no-print">送信</th>
                                    <th className="border p-2 w-24 no-print">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                {data.students.map((s, idx) => {
                                    const rec = dailyStore.records[s.id];
                                    return (
                                        <tr key={s.id} className={rec && rec.hasWarning ? 'bg-red-50' : (rec ? 'bg-white' : 'bg-gray-50/70')}>
                                            <td className="border p-2 text-center text-gray-500">{idx + 1}</td>
