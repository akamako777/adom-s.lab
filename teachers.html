                                            <td className="border p-2 font-bold text-gray-800">{s.name || '未設定'}</td>
                                            <td className="border p-2 text-center">
                                                {!rec ? (
                                                    <span className="text-xs text-gray-400 font-bold">未入力</span>
                                                ) : rec.hasWarning ? (
                                                    <span className="inline-block bg-red-600 text-white text-xs font-black px-2 py-0.5 rounded-full">要確認</span>
                                                ) : (
                                                    <span className="inline-block bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-0.5 rounded-full">済 {rec.time}</span>
                                                )}
                                            </td>
                                            {activeQuestions.map(q => {
                                                const ans = rec && rec.answersMap ? (rec.answersMap[q.id] || '') : '';
                                                const matched = q.options.find((o, oi) => {
                                                    const lb = (o.label && String(o.label).trim()) ? String(o.label) : ('選択肢' + (oi + 1));
                                                    const ev = (o.value && String(o.value).trim()) ? String(o.value) : lb;
                                                    return ev === ans || lb === ans;
                                                });
                                                const isWarnCell = !!(matched && matched.warn);
                                                return (
                                                    <td key={q.id} className={'border p-2 text-xs ' + (isWarnCell ? 'text-red-700 font-black bg-red-100/70' : 'text-gray-700')}>
                                                        {ans || '-'}
                                                    </td>
                                                );
                                            })}
                                            <td className="border p-2 text-center text-xs no-print">
                                                {!rec ? '-' : rec.synced ? (
                                                    <span className="text-emerald-600 font-bold">済</span>
                                                ) : (
                                                    <span className="text-amber-600 font-bold" title={rec.syncError || '未送信'}>未送信</span>
                                                )}
                                            </td>
                                            <td className="border p-2 text-center no-print">
                                                {rec && (
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            const next = { ...dailyStore.records };
                                                            delete next[s.id];
                                                            setDailyStore(prev => ({ ...prev, records: next }));
                                                            showToast(s.name + 'さんの当日入力をやり直し可能にしました', 'info');
                                                        }}
                                                        className="text-xs font-bold text-blue-600 hover:underline cursor-pointer"
                                                    >
                                                        やり直し
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </Card>
            );

            const renderSettingsView = () => (
                <div className="space-y-6">
                    <Card
                        title="1. スプレッドシート（GAS）連携URL設定"
                        subtitle="デプロイしたウェブアプリURLを貼り付け、ロックしておくと子どもが誤って変更するのを防げます。"
                        action={
                            <div className="flex flex-wrap gap-2">
                                {healthConfig.lockPass && (
                                    <Button
                                        variant="ghost"
                                        className="border border-gray-300 text-gray-700"
                                        onClick={() => setPassModalMode('resetPass')}
                                        title="登録済みパスワードをリセットし、次回新しく設定し直せるようにします"
                                    >
                                        <Icons.RefreshCw size={16} /> パスワード解除
                                    </Button>
                                )}
                                <Button
                                    variant={healthConfig.isLocked ? 'danger' : 'secondary'}
                                    onClick={() => setPassModalMode(healthConfig.isLocked ? 'unlockSettings' : 'lockSettings')}
                                >
                                    {healthConfig.isLocked ? <Icons.Lock size={16} /> : <Icons.Unlock size={16} />}
                                    {healthConfig.isLocked ? '設定ロック解除' : '設定をロック'}
                                </Button>
                            </div>
                        }
                    >
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">
                                    GAS ウェブアプリURL
                                </label>
                                <div className="flex flex-wrap gap-2">
                                    <input
                                        type="url"
                                        disabled={healthConfig.isLocked}
                                        value={healthConfig.gasUrl}
                                        onChange={e => updateHealthConfig({ gasUrl: e.target.value })}
                                        placeholder="https://script.google.com/macros/s/.../exec"
                                        className="flex-1 min-w-[260px] border rounded-lg p-2.5 text-sm font-mono bg-white disabled:bg-gray-100"
                                    />
                                    <Button
                                        variant="primary"
                                        onClick={handleTestGasConnection}
                                        disabled={isTestingGas || !(healthConfig.gasUrl || '').trim()}
                                    >
                                        <Icons.Send size={16} /> {isTestingGas ? 'テスト中...' : '接続テスト'}
                                    </Button>
                                </div>
                                {healthConfig.isLocked && (
                                    <p className="text-xs font-bold text-red-600 mt-1 flex items-center gap-1">
                                        <Icons.Lock size={13} /> 現在ロック中のためURL・質問の編集は保護されています。
                                    </p>
                                )}
                            </div>

                            <div className="p-3 bg-slate-50 border rounded-lg">
                                <label className="flex items-center gap-2 text-sm font-bold text-gray-700 cursor-pointer">
                                    <input
                                        type="checkbox"
                                        disabled={healthConfig.isLocked}
                                        checked={!!healthConfig.allowKidOverwrite}
                                        onChange={e => updateHealthConfig({ allowKidOverwrite: e.target.checked })}
                                        className="w-4 h-4"
                                    />
                                    子どもが入力済みの自分の名前を押したとき、「やりなおす（上書き）」を許可する
                                </label>
                                <p className="text-xs text-gray-500 mt-1 ml-6">
                                    ※OFFの場合、誤入力時は先生側の「本日の確認」画面からやり直しできます。
                                </p>
                            </div>

                            <div className="flex flex-wrap gap-2 pt-2 border-t">
                                <Button variant="secondary" onClick={() => setShowGuide(prev => !prev)}>
                                    <Icons.Info size={16} /> {showGuide ? '導入手順を閉じる' : 'GAS導入手順を見る'}
                                </Button>
                                <Button variant="secondary" onClick={() => setShowGasCode(prev => !prev)}>
                                    <Icons.ClipboardList size={16} /> {showGasCode ? 'GASコードを閉じる' : 'スプレッドシート用GASコードを表示'}
                                </Button>
                                <Button variant="success" onClick={handleCopyGasCode}>
                                    <Icons.Copy size={16} /> GASコードをコピー
                                </Button>
                            </div>

                            {showGuide && (
                                <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-950 space-y-2">
                                    <div className="font-black text-blue-900">Googleスプレッドシート連携の初回セットアップ手順</div>
                                    <ol className="list-decimal list-inside space-y-1 text-xs sm:text-sm">
                                        <li>新しいGoogleスプレッドシートを開き、上部メニュー「拡張機能 ＞ Apps Script」を開きます。</li>
                                        <li>最初から入っているコードをすべて消し、上の「GASコードをコピー」ボタンでコピーしたコードを貼り付けて保存します。</li>
                                        <li>上部ツールバーの関数一覧から <span className="font-mono font-bold bg-white px-1.5 py-0.5 rounded">setupSheets</span> を選んで「実行」し、権限を許可します（日別・個人別・週別・月別・年別シートが自動作成されます）。</li>
                                        <li>右上の「デプロイ ＞ 新しいデプロイ」で種類に「ウェブアプリ」を選び、実行ユーザーを「自分」、アクセスできるユーザーを「全員」にしてデプロイします。</li>
                                        <li>発行されたウェブアプリURLを上の入力欄に貼り付け、「接続テスト」が成功すれば完了です。</li>
                                    </ol>
                                </div>
                            )}

                            {showGasCode && (
                                <div className="space-y-2">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-bold text-gray-600">Apps Script 貼り付け用コード（最大8問・自動集計対応）</span>
                                        <button
                                            type="button"
                                            onClick={handleCopyGasCode}
                                            className="text-xs font-bold text-blue-600 hover:underline cursor-pointer"
                                        >
                                            コピーする
                                        </button>
                                    </div>
                                    <textarea
                                        readOnly
                                        value={GAS_CODE_TEMPLATE}
                                        className="w-full h-64 p-3 border rounded-lg font-mono text-xs bg-slate-900 text-slate-100"
                                    />
                                </div>
                            )}
                        </div>
                    </Card>

                    <Card
                        title={'2. 子ども向け質問のカスタマイズ（表示中 ' + activeQuestions.length + '問 ／ 登録 ' + allQuestions.length + ' / 最大' + MAX_HEALTH_QUESTIONS + '問）'}
                        subtitle="質問の追加・並び替え・ON/OFF・選択肢と「要確認」フラグを自由に編集できます。"
                        action={
                            <div className="flex flex-wrap gap-2">
                                <Button
                                    variant="secondary"
                                    disabled={healthConfig.isLocked}
                                    onClick={() => setResetDefaultConfirm(true)}
                                >
                                    <Icons.RefreshCw size={16} /> 初期4問に戻す
                                </Button>
                                <Button
                                    variant="primary"
                                    disabled={healthConfig.isLocked || allQuestions.length >= MAX_HEALTH_QUESTIONS}
                                    onClick={handleAddBlankQuestion}
                                >
                                    <Icons.Plus size={16} /> 自由な質問を追加
                                </Button>
                            </div>
                        }
                    >
                        <div className="mb-5 p-3.5 bg-sky-50 border border-sky-200 rounded-xl">
                            <div className="text-xs font-black text-sky-900 mb-2">プリセットから質問を追加（ワンクリック）：</div>
                            <div className="flex flex-wrap gap-2">
                                {[
                                    ['health', '＋ 体調（イラスト）'],
                                    ['weather', '＋ きもちの天気（イラスト）'],
                                    ['homework', '＋ 今日の宿題'],
                                    ['consult', '＋ 先生に相談（イラスト）'],
                                    ['breakfast', '＋ 朝ごはん'],
                                    ['belongings', '＋ わすれもの'],
                                    ['sleep', '＋ すいみん'],
                                    ['motivation', '＋ やる気']
                                ].map(([key, label]) => (
                                    <button
                                        key={key}
                                        type="button"
                                        disabled={healthConfig.isLocked || allQuestions.length >= MAX_HEALTH_QUESTIONS}
                                        onClick={() => handleAddPresetQuestion(key)}
                                        className="px-3 py-1.5 rounded-lg bg-white hover:bg-sky-100 border border-sky-300 text-sky-900 font-bold text-xs disabled:opacity-40 cursor-pointer"
                                    >
                                        {label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="space-y-4">
                            {allQuestions.map((q, qIdx) => (
                                <div key={q.id || qIdx} className={'border-2 rounded-xl p-4 transition-colors ' + (q.enabled ? 'bg-white border-slate-200' : 'bg-gray-50 border-dashed border-gray-300 opacity-75')}>
                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3 pb-2 border-b">
                                        <div className="flex items-center gap-3">
                                            <span className="bg-blue-600 text-white text-xs font-black px-2.5 py-1 rounded-full">質問 {qIdx + 1}</span>
                                            <label className="flex items-center gap-1.5 text-xs font-bold text-gray-700 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    disabled={healthConfig.isLocked}
                                                    checked={q.enabled}
                                                    onChange={e => handleToggleQuestionEnabled(qIdx, e.target.checked)}
                                                    className="w-4 h-4"
                                                />
                                                子ども画面に表示する
                                            </label>
                                        </div>
                                        <div className="flex items-center gap-1">
                                            <button
                                                type="button"
                                                disabled={healthConfig.isLocked || qIdx === 0}
                                                onClick={() => handleMoveQuestion(qIdx, -1)}
                                                className="p-1.5 rounded border bg-white hover:bg-gray-100 text-gray-600 disabled:opacity-30 cursor-pointer"
                                                title="上へ移動"
                                            >
                                                <Icons.ArrowUp size={15} />
                                            </button>
                                            <button
                                                type="button"
                                                disabled={healthConfig.isLocked || qIdx === allQuestions.length - 1}
                                                onClick={() => handleMoveQuestion(qIdx, 1)}
                                                className="p-1.5 rounded border bg-white hover:bg-gray-100 text-gray-600 disabled:opacity-30 cursor-pointer"
                                                title="下へ移動"
                                            >
                                                <Icons.ArrowDown size={15} />
                                            </button>
                                            <button
                                                type="button"
                                                disabled={healthConfig.isLocked || allQuestions.length <= 1}
                                                onClick={() => handleDeleteQuestion(qIdx)}
                                                className="p-1.5 rounded border border-red-200 bg-white hover:bg-red-50 text-red-500 disabled:opacity-30 cursor-pointer ml-1"
                                                title="この質問を削除"
                                            >
                                                <Icons.Trash size={15} />
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-gray-600 mb-1">質問文（ふりがな付きも可）</label>
                                            <input
                                                type="text"
                                                disabled={healthConfig.isLocked}
                                                value={q.title}
                                                onChange={e => {
                                                    const val = e.target.value;
                                                    updateQuestions(list => { list[qIdx].title = val; return list; });
                                                }}
                                                placeholder={'しつもん' + (qIdx + 1) + 'を入力'}
                                                className="w-full border rounded-lg p-2 text-sm font-bold bg-white disabled:bg-gray-100"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 mb-1">カードのデザイン</label>
                                            <select
                                                disabled={healthConfig.isLocked}
                                                value={q.artType || 'choice'}
                                                onChange={e => {
                                                    const val = e.target.value;
                                                    updateQuestions(list => { list[qIdx].artType = val; return list; });
                                                }}
                                                className="w-full border rounded-lg p-2 text-sm font-bold bg-white disabled:bg-gray-100"
                                            >
                                                <option value="choice">番号カード（汎用）</option>
                                                <option value="homework">◎○△×カード（宿題など）</option>
                                                <option value="health">体調イラスト（5段階）</option>
                                                <option value="weather">天気イラスト（5段階）</option>
                                                <option value="consult">相談イラスト（2択）</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-gray-600">
                                                選択肢（{q.options.length} / 2〜5個）※「要確認」をONにすると先生画面・シートで赤強調されます
                                            </span>
                                            <button
                                                type="button"
                                                disabled={healthConfig.isLocked || q.options.length >= 5}
                                                onClick={() => {
                                                    updateQuestions(list => {
                                                        if (list[qIdx].options.length >= 5) return list;
                                                        const n = list[qIdx].options.length + 1;
                                                        list[qIdx].options.push({ value: '選択肢' + n, label: '選択肢' + n, sub: '', warn: false });
                                                        return list;
                                                    });
                                                }}
                                                className="text-xs font-bold text-blue-600 hover:underline disabled:opacity-40 cursor-pointer"
                                            >
                                                ＋ 選択肢を追加
                                            </button>
                                        </div>
                                        {q.options.map((opt, oIdx) => (
                                            <div key={oIdx} className="flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-lg border">
                                                <span className="text-xs font-black text-gray-400 w-5 text-center">{oIdx + 1}</span>
                                                <input
                                                    type="text"
                                                    disabled={healthConfig.isLocked}
                                                    value={opt.label}
                                                    onChange={e => {
                                                        const val = e.target.value;
                                                        updateQuestions(list => {
                                                            list[qIdx].options[oIdx].label = val;
                                                            list[qIdx].options[oIdx].value = val;
                                                            return list;
                                                        });
                                                    }}
                                                    placeholder={'選択肢' + (oIdx + 1)}
                                                    className="flex-1 min-w-[160px] border rounded p-1.5 text-sm bg-white disabled:bg-gray-100"
                                                />
                                                <input
                                                    type="text"
                                                    disabled={healthConfig.isLocked}
                                                    value={opt.sub || ''}
                                                    onChange={e => {
                                                        const val = e.target.value;
                                                        updateQuestions(list => {
                                                            list[qIdx].options[oIdx].sub = val;
                                                            return list;
                                                        });
                                                    }}
                                                    placeholder="補足（任意・空欄可）"
                                                    className="w-36 border rounded p-1.5 text-xs bg-white disabled:bg-gray-100"
                                                />
                                                <label className="flex items-center gap-1 text-xs font-bold text-red-600 cursor-pointer whitespace-nowrap px-1">
                                                    <input
                                                        type="checkbox"
                                                        disabled={healthConfig.isLocked}
                                                        checked={!!opt.warn}
                                                        onChange={e => {
                                                            const checked = e.target.checked;
                                                            updateQuestions(list => {
                                                                list[qIdx].options[oIdx].warn = checked;
                                                                return list;
                                                            });
                                                        }}
                                                        className="w-3.5 h-3.5"
                                                    />
                                                    要確認
                                                </label>
                                                <button
                                                    type="button"
                                                    disabled={healthConfig.isLocked || q.options.length <= 2}
                                                    onClick={() => {
                                                        updateQuestions(list => {
                                                            if (list[qIdx].options.length <= 2) return list;
                                                            list[qIdx].options.splice(oIdx, 1);
                                                            return list;
                                                        });
                                                    }}
                                                    className="text-gray-400 hover:text-red-500 disabled:opacity-30 p-1 cursor-pointer"
                                                    title="選択肢を削除"
                                                >
                                                    <Icons.X size={16} />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </Card>
                </div>
            );

            const passModalMeta = {
                lockSettings: {
                    isLocking: true,
                    title: 'URL・質問設定のロック',
                    desc: '子どもが誤って設定を書き換えないためのパスワードを設定してください。'
                },
                unlockSettings: {
                    isLocking: false,
                    title: '設定ロックの解除',
                    desc: '設定したパスワードを入力してください。'
                },
                enterKiosk: {
                    isLocking: true,
                    title: '児童入力モードのパスワード設定',
                    desc: '先生用メニューへ戻るときに必要なパスワードを設定してください。'
                },
                exitKiosk: {
                    isLocking: false,
                    title: '先生用メニューへ戻る',
                    desc: 'パスワードを入力して児童入力モードを終了してください。'
                },
                resetPass: {
                    isLocking: false,
                    title: '登録済みパスワードの解除',
                    desc: '現在のパスワードを入力すると登録が解除され、次回新しく設定し直せます。'
                }
            }[passModalMode] || { isLocking: false, title: '', desc: '' };

            return (
                <div className="space-y-4">
                    <ConfirmModal
                        isOpen={resetDefaultConfirm}
                        onClose={() => setResetDefaultConfirm(false)}
                        onConfirm={handleResetQuestionsToDefault}
                        message="質問リストを初期の4問（体調・きもちの天気・今日の宿題・先生に相談）に戻します。よろしいですか？"
                    />

                    <PasswordModal
                        isOpen={!!passModalMode}
                        onClose={() => setPassModalMode(null)}
                        onConfirm={handlePasswordConfirm}
                        isLocking={passModalMeta.isLocking}
                        titleText={passModalMeta.title}
                        descText={passModalMeta.desc}
                    />

                    {alreadyDoneModal && (
                        <div className="modal-overlay no-print">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-2xl max-w-md w-full text-center animate-fade-in border-4 border-emerald-300">
                                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-3">
                                    <Icons.CheckCircle size={40} />
                                </div>
                                <h3 className="text-2xl font-black text-gray-800 mb-2">
                                    {alreadyDoneModal.student.name} さんは<br />きょうの 入力ずみ だよ！
                                </h3>
                                <p className="text-sm font-bold text-gray-600 mb-6">
                                    {healthConfig.allowKidOverwrite
                                        ? 'まちがえて おした ときは「やりなおす」を おしてね。'
                                        : 'まちがえて おした ときは、せんせいに おはなし してね。'}
                                </p>
                                <div className="flex justify-center gap-3">
                                    {healthConfig.allowKidOverwrite && (
                                        <button
                                            onClick={() => {
                                                const rec = dailyStore.records[alreadyDoneModal.student.id];
                                                clearAutoBackTimer();
                                                clearStepTimer();
                                                setSelectedStudent(alreadyDoneModal);
                                                setAnswersMap(rec && rec.answersMap ? { ...rec.answersMap } : {});
                                                setStep(1);
                                                setAlreadyDoneModal(null);
                                            }}
                                            className="px-5 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-black text-base cursor-pointer"
                                        >
                                            やりなおす
                                        </button>
                                    )}
                                    <button
                                        onClick={() => setAlreadyDoneModal(null)}
                                        className="px-7 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-base cursor-pointer"
                                    >
                                        とじる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isKioskMode ? (
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-wrap items-center justify-between gap-2 mb-4 bg-white/90 backdrop-blur border border-sky-200 rounded-2xl px-4 py-2.5 shadow-sm">
                                <div className="flex items-center gap-2 font-black text-sky-900 text-sm sm:text-base">
                                    <Icons.Heart size={20} />
                                    <span>まいにちの けんこうかんさつ</span>
                                    {data.settings.gradeClass && (
                                        <span className="bg-sky-100 text-sky-800 px-2.5 py-0.5 rounded-full text-xs">
                                            {data.settings.gradeClass}
                                        </span>
                                    )}
                                </div>
                                <button
                                    onClick={() => setPassModalMode('exitKiosk')}
                                    className="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer"
                                >
                                    <Icons.Lock size={15} /> 先生用メニューへ
                                </button>
                            </div>
                            {renderKidInputView()}
                        </div>
                    ) : (
                        <div>
                            <div className="bg-white rounded-xl shadow-sm border p-3 mb-5 flex flex-wrap items-center justify-between gap-2 no-print">
                                <div className="flex flex-wrap gap-2">
                                    <Button variant={subTab === 'input' ? 'primary' : 'secondary'} onClick={() => setSubTab('input')}>
                                        <Icons.Smile size={16} /> 子ども入力画面
                                    </Button>
                                    <Button variant={subTab === 'today' ? 'primary' : 'secondary'} onClick={() => setSubTab('today')}>
                                        <Icons.ClipboardList size={16} /> 本日の確認
                                        {warnCount > 0 && (
                                            <span className="ml-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">
                                                要確認 {warnCount}
                                            </span>
                                        )}
                                    </Button>
                                    <Button variant={subTab === 'settings' ? 'primary' : 'secondary'} onClick={() => setSubTab('settings')}>
                                        <Icons.Settings size={16} /> GAS連携・質問設定
                                    </Button>
                                </div>
                                <div className="flex items-center gap-2">
                                    {!(healthConfig.gasUrl || '').trim() && (
                                        <span className="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full">
                                            GAS未連携（端末保存のみ）
                                        </span>
                                    )}
                                    <Button variant="success" onClick={handleStartKioskClick} title="他タブや設定を隠して子ども入力専用画面に固定します">
                                        <Icons.Shield size={16} /> 児童入力モード開始
                                    </Button>
                                </div>
                            </div>

                            {subTab === 'input' && renderKidInputView()}
                            {subTab === 'today' && renderTodayCheckView()}
                            {subTab === 'settings' && renderSettingsView()}
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 13. メインアプリ
        // ==========================================
        const App = () => {
            const [activeSlot, setActiveSlot] = useState(() => {
                return parseInt(localStorage.getItem('classToolActiveSlot'), 10) || 1;
            });
            const [slotNames, setSlotNames] = useState(['', '', '']);

            // 児童入力モード（画面ロック）の永続化と別タブ同期
            const [isKioskMode, setIsKioskMode] = useState(() => {
                return localStorage.getItem('classToolKioskMode') === '1';
            });

            useEffect(() => {
                localStorage.setItem('classToolKioskMode', isKioskMode ? '1' : '0');
                document.body.className = isKioskMode ? 'kiosk-mode' : 'pc-table-mode';
            }, [isKioskMode]);

            useEffect(() => {
                const onStorage = (e) => {
                    if (e.key === 'classToolKioskMode') {
                        const locked = e.newValue === '1';
                        setIsKioskMode(locked);
                        if (locked) setTab('health');
                    }
                };
                window.addEventListener('storage', onStorage);
                return () => window.removeEventListener('storage', onStorage);
            }, []);

            const loadSlotData = (slot) => {
                const base = {
                    settings: { school: '', teacher: '', gradeClass: '' },
                    students: [],
                    seatConfig: { rows: 5, cols: 6, disabledSeats: [], layoutIds: [] },
                    dutyConfig: { jobs: [], duration: 15, type: 'week' },
                    clubConfig: { clubs: [], lockedStudentIds: [] },
                    healthConfig: normalizeHealthConfig(null)
                };
                const s = localStorage.getItem('classToolDataV2_' + slot);
                if (!s) return base;
                try {
                    const parsed = JSON.parse(s);
                    const nextSeatConfig = { ...base.seatConfig, ...(parsed.seatConfig || {}) };
                    // 読み込み時にも範囲外の disabledSeats を自動クリーンアップ（修正①の徹底）
                    nextSeatConfig.disabledSeats = sanitizeDisabledSeats(
                        nextSeatConfig.disabledSeats,
                        nextSeatConfig.rows,
                        nextSeatConfig.cols
                    );
                    if (!Array.isArray(nextSeatConfig.layoutIds)) {
                        nextSeatConfig.layoutIds = [];
                    }
                    // 読み込み時にも指導対象OFFの生徒の fixedSeat を正規化（修正③の徹底）
                    const normalizedStudents = (Array.isArray(parsed.students) ? parsed.students : []).map(stu => ({
                        ...stu,
                        fixedSeat: stu.needsSupport ? stu.fixedSeat : null
                    }));
                    return {
                        settings: { ...base.settings, ...(parsed.settings || {}) },
                        students: normalizedStudents,
                        seatConfig: nextSeatConfig,
                        dutyConfig: { ...base.dutyConfig, ...(parsed.dutyConfig || {}) },
                        clubConfig: { ...base.clubConfig, ...(parsed.clubConfig || {}) },
                        healthConfig: normalizeHealthConfig(parsed.healthConfig)
                    };
                } catch (e) {
                    return base;
                }
            };

            const [data, setData] = useState(() => loadSlotData(activeSlot));
            const [tab, setTab] = useState(() => (localStorage.getItem('classToolKioskMode') === '1' ? 'health' : 'students'));

            const [appState, setAppState] = useState(() => {
                const s = localStorage.getItem('classToolAppState_' + activeSlot);
                if (!s) return { isLocked: false, lockPass: null };
                try {
                    return JSON.parse(s);
                } catch (e) {
                    return { isLocked: false, lockPass: null };
                }
            });

            const [toasts, setToasts] = useState([]);
            const showToast = useCallback((message, type = 'info') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3200);
            }, []);

            useEffect(() => {
                const names = [];
                for (let i = 1; i <= 3; i++) {
                    const s = localStorage.getItem('classToolDataV2_' + i);
                    if (s) {
                        try {
                            names.push(JSON.parse(s).settings.gradeClass || ('枠' + i));
                        } catch (e) {
                            names.push('枠' + i);
                        }
                    } else {
                        names.push('枠' + i);
                    }
                }
                setSlotNames(names);
            }, []);

            useEffect(() => {
                localStorage.setItem('classToolDataV2_' + activeSlot, JSON.stringify(data));
                localStorage.setItem('classToolActiveSlot', String(activeSlot));
                setSlotNames(prev => {
                    const next = [...prev];
                    next[activeSlot - 1] = data.settings.gradeClass || ('枠' + activeSlot);
                    return next;
                });
            }, [data, activeSlot]);

            useEffect(() => {
                localStorage.setItem('classToolAppState_' + activeSlot, JSON.stringify(appState));
            }, [appState, activeSlot]);

            const handleSlotChange = (slot) => {
                if (slot === activeSlot) return;
                setActiveSlot(slot);
                setData(loadSlotData(slot));
                const s = localStorage.getItem('classToolAppState_' + slot);
                try {
                    setAppState(s ? JSON.parse(s) : { isLocked: false, lockPass: null });
                } catch (e) {
                    setAppState({ isLocked: false, lockPass: null });
                }
                showToast('データ枠を「' + (slotNames[slot - 1] || ('枠' + slot)) + '」に切り替えました', 'info');
            };

            const handleExitKiosk = () => {
                setIsKioskMode(false);
                setTab('health');
            };

            const resetAllData = async () => {
                const initialData = {
                    settings: { school: '', teacher: '', gradeClass: '' },
                    students: [],
                    seatConfig: { rows: 5, cols: 6, disabledSeats: [], layoutIds: [] },
                    dutyConfig: { jobs: [], duration: 15, type: 'week' },
                    clubConfig: { clubs: [], lockedStudentIds: [] },
                    healthConfig: normalizeHealthConfig(null)
                };
                const initialAppState = { isLocked: false, lockPass: null };

                setData(initialData);
                setAppState(initialAppState);
                localStorage.removeItem('classToolDataV2_' + activeSlot);
                localStorage.removeItem('classToolAppState_' + activeSlot);
                localStorage.removeItem('classToolHealthDaily_' + activeSlot);

                await saveToDB('assignedPhotos_' + activeSlot, {});
                await saveToDB('stockPhotos_' + activeSlot, []);

                showToast('枠' + activeSlot + ' のすべてのデータを初期化しました', 'success');
            };

            return (
                <div className="min-h-screen pb-20 relative">
                    <ToastContainer toasts={toasts} />

                    {!isKioskMode && (
                        <>
                            {/* スロット切り替えUI */}
                            <div className="bg-gray-800 text-white no-print">
                                <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto text-sm pt-2 gap-1">
                                    {[1, 2, 3].map(slot => (
                                        <button
                                            key={slot}
                                            onClick={() => handleSlotChange(slot)}
                                            className={'px-5 py-2 rounded-t-lg font-bold transition-colors flex items-center gap-2 whitespace-nowrap cursor-pointer ' +
                                                (activeSlot === slot ? 'bg-white text-blue-800 shadow-sm' : 'bg-gray-700 text-gray-300 hover:bg-gray-600')}
                                        >
                                            <Icons.Layers size={16} />
                                            {slotNames[slot - 1] || ('データ枠 ' + slot)}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* メインヘッダー */}
                            <header className="bg-white shadow-sm border-b sticky top-0 z-50 no-print">
                                <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
                                    <h1 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                        <Icons.Smile /> クラス管理ツール Pro
                                    </h1>
                                    <div className="flex gap-1 overflow-x-auto pb-1 sm:pb-0">
                                        <Button onClick={() => setTab('students')} variant={tab === 'students' ? 'primary' : 'ghost'}><Icons.Users /> 名簿</Button>
                                        <Button onClick={() => setTab('seats')} variant={tab === 'seats' ? 'primary' : 'ghost'}><Icons.Grid /> 席替</Button>
                                        <Button onClick={() => setTab('duties')} variant={tab === 'duties' ? 'primary' : 'ghost'}><Icons.Calendar /> 当番</Button>
                                        <Button onClick={() => setTab('clubs')} variant={tab === 'clubs' ? 'primary' : 'ghost'}><Icons.Layers /> 班</Button>
                                        <Button onClick={() => setTab('photos')} variant={tab === 'photos' ? 'primary' : 'ghost'} className="border-l border-gray-200 ml-1 pl-3 text-blue-600"><Icons.Image /> 写真</Button>
                                        <Button onClick={() => setTab('health')} variant={tab === 'health' ? 'success' : 'ghost'} className={'border-l border-gray-200 ml-1 pl-3 ' + (tab === 'health' ? '' : 'text-emerald-600')}><Icons.Heart /> 健康観察</Button>
                                    </div>
                                </div>
                            </header>
                        </>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-6">
                        <div className="hidden print:block text-center mb-4" id="print-header">
                            <h1 className="text-2xl font-bold">{data.settings.school} {data.settings.gradeClass}</h1>
                            <div className="text-right">担任: {data.settings.teacher}</div>
                        </div>

                        {isKioskMode ? (
                            <HealthCheckTool
                                key={'health-kiosk-' + activeSlot}
                                data={data}
                                setData={setData}
                                activeSlot={activeSlot}
                                showToast={showToast}
                                isKioskMode={isKioskMode}
                                setIsKioskMode={setIsKioskMode}
                                onExitKiosk={handleExitKiosk}
                            />
                        ) : (
                            <>
                                {tab === 'students' && (
                                    <StudentRegistration
                                        key={'students-' + activeSlot}
                                        data={data}
                                        setData={setData}
                                        isLocked={appState.isLocked}
                                        setIsLocked={(val) => setAppState(prev => ({ ...prev, isLocked: val }))}
                                        lockPass={appState.lockPass}
                                        setLockPass={(val) => setAppState(prev => ({ ...prev, lockPass: val }))}
                                        resetAll={resetAllData}
                                        showToast={showToast}
                                    />
                                )}
                                {tab === 'seats' && <SeatingTool key={'seats-' + activeSlot} data={data} setData={setData} showToast={showToast} />}
                                {tab === 'duties' && <DutyTool key={'duties-' + activeSlot} data={data} setData={setData} showToast={showToast} />}
                                {tab === 'clubs' && <ClubTool key={'clubs-' + activeSlot} data={data} setData={setData} showToast={showToast} />}
                                {tab === 'photos' && <PhotoTool key={'photos-' + activeSlot} activeSlot={activeSlot} data={data} showToast={showToast} />}
                                {tab === 'health' && (
                                    <HealthCheckTool
                                        key={'health-' + activeSlot}
                                        data={data}
                                        setData={setData}
                                        activeSlot={activeSlot}
                                        showToast={showToast}
                                        isKioskMode={isKioskMode}
                                        setIsKioskMode={setIsKioskMode}
                                        onExitKiosk={handleExitKiosk}
                                    />
                                )}
                            </>
                        )}
                    </main>

                    {!isKioskMode && (
                        <footer className="no-print fixed bottom-0 w-full bg-white border-t py-2 text-center text-xs text-gray-400">
                            【枠{activeSlot}】自動保存中（設定・名簿・写真・健康観察）
                        </footer>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        // オフライン対応（PWA）の設定
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('SW Registration Failed', err));
            });
        }
    </script>
</body>
</html>
