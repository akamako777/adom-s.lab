<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 外部ライブラリは完全固定バージョンを使用 -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f0f9ff;
        }

        /* 通常（先生用）は表崩れ防止、児童入力モードはタブレット完全レスポンシブ */
        body.pc-table-mode {
            min-width: 1100px;
            overflow-x: auto;
        }
        body.kiosk-mode {
            min-width: 0;
            overflow-x: hidden;
            background: linear-gradient(180deg, #e0f2fe 0%, #f0fdf4 100%);
        }

        @media print {
            body {
                display: none;
            }
        }

        .roulette-active .seat-card {
            animation: pulse 0.1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.55);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            overflow-y: auto;
            padding: 16px;
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            min-width: 250px;
            max-width: 90vw;
            padding: 14px 16px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.25s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-success { background-color: #10B981; }
        .toast-error { background-color: #EF4444; }
        .toast-info { background-color: #3B82F6; }
        .toast-warning { background-color: #F59E0B; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .drop-zone {
            border: 2px dashed #93c5fd;
            transition: all 0.2s;
        }
        .drop-zone.dragover {
            background-color: #eff6ff;
            border-color: #3b82f6;
        }

        /* 子ども向けタップボタンの押し心地 */
        .kid-tap-card {
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .kid-tap-card:active {
            transform: scale(0.96);
        }
    </style>
</head>

        // ==========================================
        // 2. IndexedDB・画像・印刷・クリップボードユーティリティ
        // ==========================================
        const DB_NAME = 'ClassToolPhotoDB';
        const STORE_NAME = 'photos';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const saveToDB = async (key, data) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.put(data, key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                console.error('IndexedDB Save Error:', e);
            }
        };

        const loadFromDB = async (key) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                console.error('IndexedDB Load Error:', e);
                return null;
            }
        };

        // iFrame制約でも動作するクリップボードコピー
        const copyTextSafe = (text) => {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '0';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, text.length);
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                console.error('Copy failed:', e);
                return false;
            }
        };

        // 日本時間(JST)の当日文字列 YYYY-MM-DD を取得
        const getTodayJST = () => {
            const now = new Date();
            const jst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
            const y = jst.getFullYear();
            const m = String(jst.getMonth() + 1).padStart(2, '0');
            const d = String(jst.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        };

        const formatTimeJST = (isoOrDate) => {
            const dt = isoOrDate ? new Date(isoOrDate) : new Date();
            const jst = new Date(dt.getTime() + (dt.getTimezoneOffset() + 540) * 60000);
            const hh = String(jst.getHours()).padStart(2, '0');
            const mm = String(jst.getMinutes()).padStart(2, '0');
            return hh + ':' + mm;
        };

        // ★修正①共通ユーティリティ：座席範囲外の disabledSeats を除外・重複排除
        const sanitizeDisabledSeats = (disabledSeats, rows, cols) => {
            const safeR = Math.max(1, parseInt(rows, 10) || 1);
            const safeC = Math.max(1, parseInt(cols, 10) || 1);
            const total = safeR * safeC;
            if (!Array.isArray(disabledSeats)) return [];
            return Array.from(new Set(disabledSeats.filter(idx => Number.isInteger(idx) && idx >= 0 && idx < total)));
        };

        // 印刷用ユーティリティ（写真列数・用紙向き完全反映）
        const handlePrint = (targetId, showToast, options = {}) => {
            const content = document.getElementById(targetId);
            const header = document.getElementById('print-header');

            let isPhotoPrint = false;
            let orientation = 'portrait';
            let printCols = 8;
            if (typeof options === 'boolean') {
                isPhotoPrint = options;
            } else if (typeof options === 'object' && options !== null) {
                isPhotoPrint = !!options.isPhotoPrint;
                orientation = options.orientation || 'portrait';
                printCols = options.printCols || 8;
            }

            if (!content) {
                showToast('印刷対象が見つかりません', 'error');
                return;
            }

            const contentHtml = content.innerHTML;
            const headerHtml = header ? header.innerHTML : '';
            const printWindow = window.open('', '_blank', 'height=800,width=1000');

            if (!printWindow) {
                showToast('ポップアップがブロックされました。設定を確認してください。', 'error');
                return;
            }

            const customCSS = isPhotoPrint
                ? '.photo-grid { display: grid !important; gap: 10px; grid-template-columns: repeat(' + printCols + ', minmax(0, 1fr)) !important; }' +
                  '.photo-card { border: 1px solid #ccc; padding: 5px; text-align: center; page-break-inside: avoid; }' +

        const resizeImage = (file, maxDimension = 1200) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            } else {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const rotateImage = (dataUrl) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.height;
                    canvas.height = img.width;
                    const ctx = canvas.getContext('2d');
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = reject;
                img.src = dataUrl;
            });
        };

            const mime = arr[0].match(/:(.*?);/)[1];

            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        };

            '      "=IF(" + key + "=\\"\\",\\"\\",COUNTIF(" + SHEET_LOG + "!" + colLetter + "$2:" + colLetter + "," + key + "))",',
            '      "=IF(" + key + "=\\"\\",\\"\\",COUNTIFS(" + SHEET_LOG + "!" + colLetter + "2:"+colLetter+","+key+","+SHEETLOG+"!I2:I,\\"要確認\\"))",',
            '      "=IF(" + key + "=\\"\\",\\"\\",IF(B" + r + "=0,0,C" + r + "/B" + r + "))",',
            '      "=IF(" + key + "=\\"\\",\\"\\",COUNTIFS(" + SHEET_LOG + "!" + colLetter + "2:"+colLetter+","+key+","+SHEETLOG+"!J2:J,\\"よい\\")+COUNTIFS(" + SHEET_LOG + "!" + colLetter + "2:"+colLetter+","+key+","+SHEETLOG+"!J2:J,\\"まあまあよい\\"))",',
            '      "=IF(" + key + "=\\"\\",\\"\\",COUNTIFS(" + SHEET_LOG + "!" + colLetter + "2:"+colLetter+","+key+","+SHEETLOG+"!J2:J,\\"*よくない*\\"))",',
            '      "=IF(" + key + "=\\"\\",\\"\\",COUNTIFS(" + SHEET_LOG + "!" + colLetter + "2:"+colLetter+","+key+","+SHEETLOG+"!K2:K,\\"*うれしい*\\"))",',
            '      "=IF(" + key + "=\\"\\",\\"\\",COUNTIFS(" + SHEET_LOG + "!" + colLetter + "2:"+colLetter+","+key+","+SHEETLOG+"!L2:L,\\"*全部*\\"))",',
            '      "=IF(" + key + "=\\"\\",\\"\\",COUNTIFS(" + SHEET_LOG + "!" + colLetter + "2:"+colLetter+","+key+","+SHEETLOG+"!M2:M,\\"ある\\"))"',
            '    ]);',
            '  }',
            '  sh.getRange(4, 2, maxRows, 8).setFormulas(formulas);',
            '  sh.getRange(4, 4, maxRows, 1).setNumberFormat("0.0%");',
            '  sh.setFrozenRows(3);',
            '}',
            '',
            'function doGet(e) {',
            '  return ContentService.createTextOutput(JSON.stringify({ status: "ok", message: "HealthCheck GAS is active." }))',
            '    .setMimeType(ContentService.MimeType.JSON);',
            '}',
            '',
            'function doPost(e) {',
            '  const lock = LockService.getScriptLock();',
            '  lock.waitLock(15000);',
            '  try {',
            '    const raw = (e && e.postData && e.postData.contents) ? e.postData.contents : "{}";',
            '    const payload = JSON.parse(raw);',
            '    if (payload.action === "ping") {',
            '      return ContentService.createTextOutput(JSON.stringify({ status: "ok", message: "接続テスト成功！" }))',
            '        .setMimeType(ContentService.MimeType.JSON);',
            '    }',
            '',
            '    const ss = SpreadsheetApp.getActiveSpreadsheet();',
            '    let sh = ss.getSheetByName(SHEET_LOG);',
            '    if (!sh) {',
            '      setupSheets();',
            '      sh = ss.getSheetByName(SHEET_LOG);',
            '    }',
            '',
            '    const now = new Date();',
            '    const tz = "Asia/Tokyo";',
            '    const dateStr = payload.date || Utilities.formatDate(now, tz, "yyyy-MM-dd");',
            '    const timestamp = Utilities.formatDate(now, tz, "yyyy-MM-dd HH:mm:ss");',
            '    const weekStr = getWeekLabelJST(dateStr);',
            '    const monthStr = dateStr.slice(0, 7);',
            '    const yearStr = dateStr.slice(0, 4);',
            '    const studentNo = Number(payload.studentNo) || "";',
            '    const studentName = String(payload.studentName || "");',
            '    const gradeClass = String(payload.gradeClass || "");',
            '    const warnFlag = payload.hasWarning ? "要確認" : "";',
            '',
            '    const ansList = Array.isArray(payload.answersList) ? payload.answersList : [];',
            '    const qMeta = Array.isArray(payload.questionsMeta) ? payload.questionsMeta : [];',
            '    const ansCols = [];',
            '    const titleCols = [];',
            '    for (let i = 0; i < MAX_Q; i++) {',
            '      ansCols.push(ansList[i] !== undefined ? String(ansList[i]) : "");',
            '      titleCols.push(qMeta[i] !== undefined ? String(qMeta[i]) : "");',
            '    }',
            '',
            '    const rowData = [',
            '      timestamp, dateStr, weekStr, monthStr, yearStr, studentNo, studentName, gradeClass, warnFlag',
            '    ].concat(ansCols).concat(titleCols);',
            '',
            '    // 当日・同一出席番号＆氏名のデータがあれば上書き（同姓同名対策）',
            '    const lastRow = sh.getLastRow();',
            '    let targetRow = -1;',
            '    if (lastRow >= 2) {',
            '      const existing = sh.getRange(2, 2, lastRow - 1, 6).getValues();',
            '      for (let i = existing.length - 1; i >= 0; i--) {',
            '        const rDate = existing[i][0] instanceof Date ? Utilities.formatDate(existing[i][0], tz, "yyyy-MM-dd") : String(existing[i][0]);',
            '        const rNo = String(existing[i][4]);',
            '        const rName = String(existing[i][5]);',
            '        if (rDate === dateStr && rNo === String(studentNo) && rName === studentName) {',
            '          targetRow = i + 2;',
            '          break;',
            '        }',
            '      }',
            '    }',
            '',
            '    const writeRow = targetRow > 0 ? targetRow : Math.max(2, lastRow + 1);',
            '    sh.getRange(writeRow, 1, 1, 5).setNumberFormat("@");',
            '    sh.getRange(writeRow, 1, 1, rowData.length).setValues([rowData]);',
            '',
            '    return ContentService.createTextOutput(JSON.stringify({ status: "ok", updated: targetRow > 0 }))',
            '      .setMimeType(ContentService.MimeType.JSON);',
            '  } catch (err) {',
            '    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: String(err) }))',
            '      .setMimeType(ContentService.MimeType.JSON);',
            '  } finally {',
            '    lock.releaseLock();',
            '  }',
            '}'
        ].join('\n');

        const ToastContainer = ({ toasts }) => (

                    <div key={t.id} className={'toast toast-' + t.type}>

                ))}
            </div>
        );

        const Button = ({ onClick, children, variant = 'primary', className = '', disabled = false, title = '', type = 'button' }) => {
            const baseStyle = 'px-4 py-2 rounded-lg font-bold transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm text-sm whitespace-nowrap cursor-pointer';
            const variants = {
                primary: 'bg-blue-500 hover:bg-blue-600 text-white',
                secondary: 'bg-white hover:bg-gray-50 text-gray-700 border border-gray-300',
                danger: 'bg-red-500 hover:bg-red-600 text-white',
                success: 'bg-emerald-500 hover:bg-emerald-600 text-white',
                warning: 'bg-amber-500 hover:bg-amber-600 text-white',
                ghost: 'bg-transparent hover:bg-gray-100 text-gray-600 shadow-none'
            };
            return (
                <button type={type} onClick={onClick} className={baseStyle + ' ' + (variants[variant] || variants.primary) + ' ' + className} disabled={disabled} title={title}>

        const Card = ({ children, title, action, id, subtitle, className = '' }) => (

                {children}

        );

        const ConfirmModal = ({ isOpen, onClose, onConfirm, message }) => {
            if (!isOpen) return null;

        const PasswordModal = ({ isOpen, onClose, onConfirm, isLocking, titleText, descText }) => {
            const [pass, setPass] = useState('');
            if (!isOpen) return null;

            const submit = (e) => {
                if (e) e.preventDefault();
                if (!pass) return;
                onConfirm(pass);
                setPass('');
            };

            return (
                <div className="modal-overlay no-print">
                    <form onSubmit={submit} className="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full animate-fade-in">
                        <h3 className="text-lg font-bold mb-2 flex items-center gap-2 text-gray-800">

        const PasteModal = ({ isOpen, onClose, onImport, title, placeholder }) => {

                            <Button variant="primary" onClick={() => { onImport(text); setText(''); onClose(); }} disabled={!text.trim()}>

        // ==========================================
        // 6. 名簿登録（修正③：指導対象OFF時の固定席クリア＆上限を座席総数へ ／ 修正⑥：ロック中の復元・オールクリア保護）
        // ==========================================
        const StudentRegistration = ({ data, setData, isLocked, setIsLocked, lockPass, setLockPass, resetAll, showToast }) => {
            const [isImportModalOpen, setImportModalOpen] = useState(false);
            const [deleteId, setDeleteId] = useState(null);
            const [showPassModal, setShowPassModal] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [showSampleConfirm, setShowSampleConfirm] = useState(false);
            const fileInputRef = useRef(null);

            const generateId = () => 's_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 9);

            // ★修正③：固定席の上限を生徒数ではなく座席総数 (rows * cols) にする
            const maxSeatCount = Math.max(1, (data.seatConfig?.rows || 5) * (data.seatConfig?.cols || 6));

            const counts = data.students.reduce((acc, s) => {
                if (s.gender === 'boy') acc.boy++;
                else if (s.gender === 'girl') acc.girl++;
                else acc.mixed++;
                return acc;
            }, { boy: 0, girl: 0, mixed: 0 });

            const addStudent = () => {
                if (isLocked) return;
                const newStudent = {
                    id: generateId(),
                    name: '',
                    gender: 'mixed',
                    needsSupport: false,
                    fixedSeat: null,
                    avoid: ['', '', '']
                };
                setData(prev => ({ ...prev, students: [...prev.students, newStudent] }));
            };

            const update = (id, field, val) => {
                if (isLocked) return;

                // ★修正③：指導対象のチェックを外したら裏に残る fixedSeat を必ず null にクリア
                if (field === 'needsSupport' && !val) {
                    setData(prev => ({
                        ...prev,
                        students: prev.students.map(s => s.id === id ? { ...s, needsSupport: false, fixedSeat: null } : s)
                    }));
                    return;
                }

                if (field === 'fixedSeat') {
                    if (val === '') {
                        setData(prev => ({ ...prev, students: prev.students.map(s => s.id === id ? { ...s, [field]: null } : s) }));
                        return;
                    }
                    let seatNum = parseInt(val, 10);
                    if (isNaN(seatNum)) return;
                    if (seatNum < 1) seatNum = 1;
                    // ★修正③：上限を座席総数 (maxSeatCount) に修正
                    if (seatNum > maxSeatCount) seatNum = maxSeatCount;

                    const isDuplicate = data.students.some(s => s.id !== id && s.needsSupport && s.fixedSeat === seatNum);
                    if (isDuplicate) {
                        showToast('席番号 ' + seatNum + ' は既に他の生徒に設定されています', 'error');
                        return;
                    }
                    val = seatNum;
                }
                setData(prev => ({ ...prev, students: prev.students.map(s => s.id === id ? { ...s, [field]: val } : s) }));
            };

            const remove = () => {
                if (isLocked) return;
                setData(prev => ({
                    ...prev,
                    students: prev.students
                        .filter(s => s.id !== deleteId)
                        .map(s => ({
                            ...s,
                            avoid: Array.isArray(s.avoid) ? s.avoid.map(aid => aid === deleteId ? '' : aid) : ['', '', '']
                        }))
                }));
                setDeleteId(null);
                showToast('生徒を削除しました', 'success');
            };

            const bulkImport = (text) => {
                if (isLocked) return;
                const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim());
                const newStudents = lines.map((l, i) => {
                    const parts = l.split('\t');
                    let gender = 'mixed';
                    if (parts[1] && /男|boy/i.test(parts[1])) gender = 'boy';
                    if (parts[1] && /女|girl/i.test(parts[1])) gender = 'girl';
                    return {
                        id: generateId() + '_' + i,
                        name: parts[0].trim(),
                        gender,
                        needsSupport: false,
                        fixedSeat: null,
                        avoid: ['', '', '']
                    };
                });
                setData(prev => ({ ...prev, students: [...prev.students, ...newStudents] }));
                showToast(newStudents.length + '名のデータを取り込みました', 'success');
            };

            const applySampleStudents = () => {
                if (isLocked) return;
                const sampleRoster = [
                    { name: '佐藤 陽翔', gender: 'boy' },
                    { name: '鈴木 蓮', gender: 'boy' },
                    { name: '高橋 湊', gender: 'boy' },
                    { name: '田中 樹', gender: 'boy' },
                    { name: '伊藤 蒼空', gender: 'boy' },
                    { name: '渡辺 悠真', gender: 'boy' },
                    { name: '山本 朝陽', gender: 'boy' },
                    { name: '中村 律', gender: 'boy' },
                    { name: '小林 大翔', gender: 'boy' },
                    { name: '加藤 暖', gender: 'boy' },
                    { name: '吉田 瑛太', gender: 'boy' },
                    { name: '山田 颯太', gender: 'boy' },
                    { name: '佐々木 陸', gender: 'boy' },
                    { name: '山口 新', gender: 'boy' },
                    { name: '松本 碧', gender: 'boy' },
                    { name: '井上 陽葵', gender: 'girl' },
                    { name: '木村 凛', gender: 'girl' },
                    { name: '林 芽依', gender: 'girl' },
                    { name: '斎藤 紬', gender: 'girl' },
                    { name: '清水 結菜', gender: 'girl' },
                    { name: '山崎 葵', gender: 'girl' },
                    { name: '森 詩', gender: 'girl' },
                    { name: '池田 咲良', gender: 'girl' },
                    { name: '橋本 杏', gender: 'girl' },
                    { name: '阿部 莉子', gender: 'girl' },
                    { name: '石川 結愛', gender: 'girl' },
                    { name: '山下 心春', gender: 'girl' },
                    { name: '中島 美月', gender: 'girl' },
                    { name: '石井 琴音', gender: 'girl' },
                    { name: '小川 花音', gender: 'girl' }
                ];

                const sampleStudents = sampleRoster.map((item, idx) => ({
                    id: generateId() + '_' + idx,
                    name: item.name,
                    gender: item.gender,
                    needsSupport: false,
                    fixedSeat: null,
                    avoid: ['', '', '']
                }));

                // 席替え・班分けテスト用の固定席とNGペアを付与
                if (maxSeatCount >= 1) {
                    sampleStudents[0].needsSupport = true;
                    sampleStudents[0].fixedSeat = 1;
                }
                if (maxSeatCount >= 3) {
                    sampleStudents[15].needsSupport = true;
                    sampleStudents[15].fixedSeat = 3;
                }
                sampleStudents[2].avoid[0] = sampleStudents[3].id;
                sampleStudents[3].avoid[0] = sampleStudents[2].id;
                sampleStudents[17].avoid[0] = sampleStudents[18].id;
                sampleStudents[18].avoid[0] = sampleStudents[17].id;

                setData(prev => ({
                    ...prev,
                    settings: {
                        school: prev.settings.school || 'サンプル小学校',
                        gradeClass: prev.settings.gradeClass || '5年1組',
                        teacher: prev.settings.teacher || '見本 太郎'
                    },
                    students: sampleStudents,
                    seatConfig: {
                        ...prev.seatConfig,
                        layoutIds: []
                    }
                }));
                setShowSampleConfirm(false);
                showToast('デバッグ用のサンプル生徒30名（男15・女15）を入力しました', 'success');
            };

            const handleSampleClick = () => {
                if (isLocked) return;
                if (data.students.length > 0) {
                    setShowSampleConfirm(true);
                } else {
                    applySampleStudents();
                }
            };

            const handleLockAction = (inputPass) => {
                const input = String(inputPass);
                const saved = String(lockPass);
                if (isLocked) {
                    if (input === saved) {
                        setIsLocked(false);
                        setLockPass(null);
                        showToast('ロックを解除しました', 'success');
                    } else {
                        showToast('パスワードが違います', 'error');
                    }
                } else {
                    setLockPass(input);
                    setIsLocked(true);
                    showToast('編集ロックを設定しました', 'success');
                }
                setShowPassModal(false);
            };

            const exportData = () => {
                const dataStr = JSON.stringify(data, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'クラス管理データ_' + (data.settings.gradeClass || '未設定') + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('バックアップデータを保存しました', 'success');
            };

            const importData = (e) => {
                // ★修正⑥：ロック中は復元処理を実行させない
                if (isLocked) {
                    e.target.value = '';
                    return;
                }
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.students && parsed.settings) {
                            const nextSeatConfig = { rows: 5, cols: 6, disabledSeats: [], layoutIds: [], ...(parsed.seatConfig || {}) };
                            nextSeatConfig.disabledSeats = sanitizeDisabledSeats(
                                nextSeatConfig.disabledSeats,
                                nextSeatConfig.rows,
                                nextSeatConfig.cols
                            );
                            if (!Array.isArray(nextSeatConfig.layoutIds)) {
                                nextSeatConfig.layoutIds = [];
                            }
                            const normalizedStudents = (Array.isArray(parsed.students) ? parsed.students : []).map(s => ({
                                ...s,
                                fixedSeat: s.needsSupport ? s.fixedSeat : null
                            }));
                            setData({
                                settings: { school: '', teacher: '', gradeClass: '', ...(parsed.settings || {}) },
                                students: normalizedStudents,
                                seatConfig: nextSeatConfig,
                                dutyConfig: { jobs: [], duration: 15, type: 'week', ...(parsed.dutyConfig || {}) },
                                clubConfig: { clubs: [], lockedStudentIds: [], ...(parsed.clubConfig || {}) },
                                healthConfig: normalizeHealthConfig(parsed.healthConfig)
                            });
                            showToast('データを復元しました', 'success');
                        } else {
                            showToast('無効なファイル形式です', 'error');
                        }
                    } catch (err) {
                        showToast('ファイルの読み込みに失敗しました', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="space-y-6">
                    <ConfirmModal isOpen={!!deleteId} onClose={() => setDeleteId(null)} onConfirm={remove} message="本当に削除しますか？" />
                    <ConfirmModal isOpen={showResetConfirm} onClose={() => setShowResetConfirm(false)} onConfirm={() => { if (!isLocked) resetAll(); setShowResetConfirm(false); }} message={'注意：現在の枠のすべてのデータ（名簿、設定、班、健康観察）や【一時保存中の写真データ】も完全に消去されます。\n本当によろしいですか？'} />
                    <ConfirmModal isOpen={showSampleConfirm} onClose={() => setShowSampleConfirm(false)} onConfirm={applySampleStudents} message={'現在の名簿をデバッグ用のサンプル生徒30名（男15・女15）で置き換えます。\nよろしいですか？'} />
                    <PasteModal isOpen={isImportModalOpen} onClose={() => setImportModalOpen(false)} onImport={bulkImport} title="Excelから一括登録" placeholder={'氏名\n氏名\t性別\n...'} />
                    <PasswordModal isOpen={showPassModal} onClose={() => setShowPassModal(false)} onConfirm={handleLockAction} isLocking={!isLocked} />

                    <Card
                        title="クラス基本情報"
                        action={
                            <div className="flex gap-2">
                                <input type="file" accept=".json" ref={fileInputRef} disabled={isLocked} className="hidden" onChange={importData} />
                                {/* ★修正⑥：編集ロック中は復元ボタンを無効化 */}
                                <Button variant="ghost" disabled={isLocked} className="text-sm border border-gray-200" onClick={() => !isLocked && fileInputRef.current.click()} title="JSONファイルから設定を復元"><Icons.FileUp /> 復元</Button>
                                <Button variant="ghost" className="text-sm border border-gray-200" onClick={exportData} title="現在の設定と名簿をバックアップ保存"><Icons.Save /> バックアップ</Button>
                            </div>
                        }
                        subtitle="※バックアップデータ(JSON)にはセキュリティ保護のため写真画像は含まれません。"
                    >
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <label className="block"><span className="text-gray-700 font-bold">学校名</span><input type="text" disabled={isLocked} className="mt-1 block w-full border rounded p-2" value={data.settings.school} onChange={e => setData({ ...data, settings: { ...data.settings, school: e.target.value } })} /></label>
                            <label className="block"><span className="text-gray-700 font-bold">学年・組</span><input type="text" disabled={isLocked} className="mt-1 block w-full border rounded p-2" value={data.settings.gradeClass} onChange={e => setData({ ...data, settings: { ...data.settings, gradeClass: e.target.value } })} /></label>
                            <label className="block"><span className="text-gray-700 font-bold">担任名</span><input type="text" disabled={isLocked} className="mt-1 block w-full border rounded p-2" value={data.settings.teacher} onChange={e => setData({ ...data, settings: { ...data.settings, teacher: e.target.value } })} /></label>
                        </div>
                    </Card>

                    <Card
                        title={'生徒名簿 (' + data.students.length + '名)'}
                        action={
                            <div className="flex flex-wrap gap-2">
                                {/* ★修正⑥：編集ロック中はオールクリアボタンを無効化 */}
                                <Button onClick={() => !isLocked && setShowResetConfirm(true)} disabled={isLocked} variant="danger" title="現在の枠の全データを初期化"><Icons.AlertOctagon /> オールクリア</Button>
                                <Button onClick={() => setShowPassModal(true)} variant={isLocked ? 'danger' : 'secondary'} title={isLocked ? 'ロック解除' : '編集ロック'}>
                                    {isLocked ? <Icons.Lock /> : <Icons.Unlock />} {isLocked ? '解除' : 'ロック'}
                                </Button>
                                <Button onClick={handleSampleClick} disabled={isLocked} variant="warning" title="デバッグ用のサンプル生徒30名を一括入力"><Icons.Users /> サンプル入力</Button>
                                <Button onClick={() => setImportModalOpen(true)} disabled={isLocked} variant="secondary"><Icons.ClipboardList /> Excel取込</Button>
                                <Button onClick={addStudent} disabled={isLocked} variant="success"><Icons.Plus /> 追加</Button>
                            </div>
                        }
                    >
                        <div className="mb-4 flex gap-4 text-sm font-bold text-gray-600 bg-gray-50 p-2 rounded no-print">
                            <span className="text-blue-600">男: {counts.boy}名</span>
                            <span className="text-red-600">女: {counts.girl}名</span>
                            <span className="text-gray-600">未設定: {counts.mixed}名</span>
                            <span className="ml-auto text-xs text-gray-500 font-normal self-center">※固定席は 1〜{maxSeatCount}番 まで指定可能</span>
                        </div>

                        {isLocked ? (
                            <div className="text-center py-10 text-gray-400 bg-gray-50 rounded border-2 border-dashed flex flex-col items-center">
                                <Icons.Lock size={48} />
                                <p className="mt-2">名簿はロックされています</p>
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase">No.</th>
                                            <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase w-40">氏名</th>
                                            <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase">性別</th>
                                            <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase">指導対象/固定席</th>
                                            <th className="px-3 py-3 text-left text-xs font-bold text-gray-500 uppercase">NG生徒</th>
                                            <th className="px-3 py-3 text-center text-xs font-bold text-gray-500 uppercase">削除</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {data.students.map((s, i) => (
                                            <tr key={s.id}>
                                                <td className="px-3 py-2 text-gray-500">{i + 1}</td>
                                                <td className="px-3 py-2"><input className="w-full border rounded p-1" value={s.name} onChange={e => update(s.id, 'name', e.target.value)} /></td>
                                                <td className="px-3 py-2">
                                                    <select className="border rounded p-1" value={s.gender} onChange={e => update(s.id, 'gender', e.target.value)}>
                                                        <option value="mixed">任意</option><option value="boy">男</option><option value="girl">女</option>
                                                    </select>
                                                </td>
                                                <td className="px-3 py-2">
                                                    <div className="flex items-center gap-2">
                                                        <input type="checkbox" checked={s.needsSupport} onChange={e => update(s.id, 'needsSupport', e.target.checked)} />
                                                        {/* ★修正③：max属性を座席総数 maxSeatCount に変更 */}
                                                        {s.needsSupport && <input type="number" min="1" max={maxSeatCount} className="w-14 border rounded p-1 text-xs" placeholder="席" value={s.fixedSeat || ''} onChange={e => update(s.id, 'fixedSeat', e.target.value)} />}
                                                    </div>
                                                </td>
                                                <td className="px-3 py-2">
                                                    <div className="flex gap-1">{[0, 1, 2].map(k => (
                                                        <select key={k} className="w-20 text-xs border rounded" value={s.avoid[k]} onChange={e => {
                                                            const nav = [...s.avoid];
                                                            nav[k] = e.target.value;
                                                            update(s.id, 'avoid', nav);
                                                        }}>
                                                            <option value="">-</option>
                                                            {data.students.filter(o => o.id !== s.id).map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                                                        </select>
                                                    ))}</div>
                                                </td>
                                                <td className="px-3 py-2 text-center"><button onClick={() => setDeleteId(s.id)} className="text-red-500 cursor-pointer"><Icons.Trash /></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        // ==========================================
        // 7. 席替えツール（修正①：範囲外×席除外 ／ 修正④：男女交互時の最前列優先 ／ 修正⑤：×切替時の配置維持）
        // ==========================================
        const SeatingTool = ({ data, setData, showToast }) => {
            const safeCols = Math.max(1, data.seatConfig.cols || 1);
            const safeRows = Math.max(1, data.seatConfig.rows || 1);
            const total = safeRows * safeCols;

            // ★修正①：有効範囲 (0 <= idx < total) 内の使用不可席のみをカウント・保持
            const rawDisabledSeats = data.seatConfig.disabledSeats || [];
            const disabledSeats = sanitizeDisabledSeats(rawDisabledSeats, safeRows, safeCols);
            const disabledSeatsKey = disabledSeats.join(',');

            const buildReconciledLayout = (prevCells, students, seatTotal, disList) => {
                const studentMap = new Map(students.map(s => [s.id, s]));
                const disSet = new Set(disList);
                const nextLayout = Array(seatTotal).fill(null);
                const placedIds = new Set();
                const displacedStudents = [];

                for (let i = 0; i < seatTotal; i++) {
                    if (disSet.has(i)) {
                        nextLayout[i] = 'disabled';
                    }
                }

                if (Array.isArray(prevCells) && prevCells.length > 0) {
                    prevCells.forEach((cell, idx) => {
                        if (!cell || cell === 'disabled') return;
                        const sid = typeof cell === 'string' ? cell : cell.id;
                        if (!sid) return;
                        const latest = studentMap.get(sid);
                        if (!latest || placedIds.has(latest.id)) return;

                        if (idx < seatTotal && !disSet.has(idx)) {
                            // そのまま同じ席に維持（最新名簿情報に更新）
                            nextLayout[idx] = latest;
                            placedIds.add(latest.id);
                        } else {
                            // ×にされた席、またはサイズ縮小で範囲外になった席の生徒を退避リストへ
                            displacedStudents.push(latest);
                        }
                    });
                }

                // 退避された生徒 → 未配置の生徒 の順で空いている有効席（前方優先）へ配置
                const unplaced = students.filter(s => !placedIds.has(s.id) && !displacedStudents.some(d => d.id === s.id));
                const queue = [...displacedStudents, ...unplaced];
                let qIdx = 0;
                for (let i = 0; i < seatTotal && qIdx < queue.length; i++) {
                    if (nextLayout[i] === null) {
                        nextLayout[i] = queue[qIdx++];
                        placedIds.add(nextLayout[i].id);
                    }
                }

                return nextLayout;
            };

            const toLayoutIds = (cells) => cells.map(cell => (
                cell === 'disabled' ? 'disabled' : (cell && cell.id ? cell.id : null)
            ));

            const [layout, setLayout] = useState(() => (
                buildReconciledLayout(data.seatConfig.layoutIds || [], data.students || [], total, disabledSeats)
            ));
            const [running, setRunning] = useState(false);
            const shuffleTimerRef = useRef(null);
            const [isAlternateGender, setIsAlternateGender] = useState(false);

            const studentCount = data.students.length;
            const validSeatCount = total - disabledSeats.length;
            const isShortage = validSeatCount < studentCount;

            useEffect(() => {
                return () => {
                    if (shuffleTimerRef.current) clearInterval(shuffleTimerRef.current);
                };
            }, []);

            // ★修正⑤：既存の座席配置を維持しつつ、サイズ変更・名簿変更・×切替の差分だけを反映
            useEffect(() => {
                if (running) return;
                setLayout(prevLayout => buildReconciledLayout(prevLayout, data.students || [], total, disabledSeats));
            }, [safeRows, safeCols, total, data.students, disabledSeatsKey]);

            // 座席配置（生徒ID配列）を seatConfig へ自動保存し、タブ切替後も維持
            useEffect(() => {
                if (running) return;
                const nextIds = toLayoutIds(layout);
                const prevIds = Array.isArray(data.seatConfig.layoutIds) ? data.seatConfig.layoutIds : [];
                const isSame = nextIds.length === prevIds.length && nextIds.every((v, idx) => v === prevIds[idx]);
                if (!isSame) {
                    setData(prev => ({
                        ...prev,
                        seatConfig: {
                            ...prev.seatConfig,
                            layoutIds: nextIds
                        }
                    }));
                }
            }, [layout, running]);

            const toggleDisableSeat = (idx) => {
                let newDisabled = [...disabledSeats];
                if (newDisabled.includes(idx)) {
                    newDisabled = newDisabled.filter(i => i !== idx);
                } else {
                    newDisabled.push(idx);
                }
                setData(prev => ({
                    ...prev,
                    seatConfig: {
                        ...prev.seatConfig,
                        disabledSeats: sanitizeDisabledSeats(newDisabled, safeRows, safeCols)
                    }
                }));
            };

            const shuffle = () => {
                if (isShortage) {
                    return showToast('有効な席数(' + validSeatCount + ')が生徒数(' + studentCount + ')より少ないため実行できません', 'error');
                }
                if (shuffleTimerRef.current) clearInterval(shuffleTimerRef.current);
                setRunning(true);
                let count = 0;
                shuffleTimerRef.current = setInterval(() => {
                    setLayout(prev => {
                        const temp = [...prev];
                        const validIndices = [];
                        temp.forEach((s, i) => { if (!disabledSeats.includes(i)) validIndices.push(i); });
                        for (let i = validIndices.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            const idxI = validIndices[i];
                            const idxJ = validIndices[j];
                            [temp[idxI], temp[idxJ]] = [temp[idxJ], temp[idxI]];
                        }
                        return temp;
                    });
                    if (++count > 15) {
                        clearInterval(shuffleTimerRef.current);
                        shuffleTimerRef.current = null;
                        finalize();
                    }
                }, 100);
            };

            const finalize = () => {
                if (total <= 0) {
                    setRunning(false);
                    return;
                }
                let best = null;
                let minScore = Infinity;
                const TRIALS = 500;

                for (let k = 0; k < TRIALS; k++) {
                    const current = Array(total).fill(null);
                    disabledSeats.forEach(idx => current[idx] = 'disabled');

                    const pool = [...data.students];
                    // ★修正③防御：needsSupport が ON かつ fixedSeat が設定されている生徒のみ固定対象
                    const fixed = pool.filter(s => s.needsSupport && s.fixedSeat !== null);
                    const others = pool.filter(s => !(s.needsSupport && s.fixedSeat !== null));

                    fixed.forEach(s => {
                        const seatIdx = s.fixedSeat - 1;
                        if (seatIdx >= 0 && seatIdx < total && current[seatIdx] !== 'disabled' && !current[seatIdx]) {
                            current[seatIdx] = s;
                        } else {
                            others.push(s);
                        }
                    });

                    for (let i = others.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [others[i], others[j]] = [others[j], others[i]];
                    }

                    if (isAlternateGender) {
                        const slots0 = [];
                        const slots1 = [];
                        for (let i = 0; i < total; i++) {
                            if (current[i] === null) {
                                const r = Math.floor(i / safeCols);
                                const c = i % safeCols;
                                if ((r + c) % 2 === 0) slots0.push(i);
                                else slots1.push(i);
                            }
                        }
                        const isZeroBoy = Math.random() < 0.5;
                        const boySlots = isZeroBoy ? slots0 : slots1;
                        const girlSlots = isZeroBoy ? slots1 : slots0;

                        const boys = others.filter(s => s.gender === 'boy');
                        const girls = others.filter(s => s.gender === 'girl');
                        const mixed = others.filter(s => s.gender !== 'boy' && s.gender !== 'girl');
                        const remainingStudents = [];

                        // ★修正④：.pop() ではなく .shift() で先頭側（教卓の前・最前列）から詰めて配置
                        boys.forEach(b => {
                            if (boySlots.length > 0) current[boySlots.shift()] = b;
                            else remainingStudents.push(b);
                        });
                        girls.forEach(g => {
                            if (girlSlots.length > 0) current[girlSlots.shift()] = g;
                            else remainingStudents.push(g);
                        });

                        // 残りの空きスロットも席番号昇順（前方優先）で .shift() して配置
                        const remainingSlots = [...boySlots, ...girlSlots].sort((a, b) => a - b);
                        const leftovers = [...mixed, ...remainingStudents];
                        for (let i = leftovers.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [leftovers[i], leftovers[j]] = [leftovers[j], leftovers[i]];
                        }
                        leftovers.forEach(s => {
                            if (remainingSlots.length > 0) current[remainingSlots.shift()] = s;
                        });
                    } else {
                        let p = 0;
                        for (let i = 0; i < total; i++) {
                            if (current[i] === null && p < others.length) current[i] = others[p++];
                        }
                    }

                    let score = 0;
                    for (let i = 0; i < total; i++) {
                        const s1 = current[i];
                        if (!s1 || s1 === 'disabled') continue;
                        if ((i + 1) % safeCols !== 0) {
                            const s2 = current[i + 1];
                            if (s2 && s2 !== 'disabled') {
                                if (s1.avoid.includes(s2.id) || s2.avoid.includes(s1.id)) score += 100;
                                if (s1.gender !== 'mixed' && s2.gender !== 'mixed' && s1.gender === s2.gender) {
                                    score += isAlternateGender ? 50 : 10;
                                }
                            }
                        }
                        if (i + safeCols < total) {
                            const sDown = current[i + safeCols];
                            if (sDown && sDown !== 'disabled') {
                                if (s1.avoid.includes(sDown.id) || sDown.avoid.includes(s1.id)) score += 100;
                                if (isAlternateGender && s1.gender !== 'mixed' && sDown.gender !== 'mixed' && s1.gender === sDown.gender) {
                                    score += 50;
                                }
                            }
                        }
                    }

                    if (score < minScore) {
                        minScore = score;
                        best = current;
                    }
                    if (score === 0) break;
                }

                setLayout(best);
                setRunning(false);
                if (minScore === 0) showToast('最適な配置が見つかりました！', 'success');
                else if (minScore < 100) showToast('配置完了（条件を一部妥協しました）', 'info');
                else showToast('配置完了（※NG条件を完全に満たせませんでした）', 'error');
            };

            const onDragStart = (e, i) => {
                if (running) return;
                e.dataTransfer.setData('idx', i);
            };
            const onDragOver = (e) => e.preventDefault();
            const onDrop = (e, to) => {
                if (running) return;
                const from = e.dataTransfer.getData('idx');
                const fromIdx = parseInt(from, 10);
                if (from === '' || isNaN(fromIdx) || fromIdx === to || disabledSeats.includes(to) || disabledSeats.includes(fromIdx)) return;
                const next = [...layout];
                [next[fromIdx], next[to]] = [next[to], next[fromIdx]];
                setLayout(next);
            };

            const doPrint = () => handlePrint('print-target', showToast);
            const doExcel = () => {
                if (layout.length === 0) return showToast('座席データがありません', 'error');
                const wb = XLSX.utils.book_new();
                const rows = [];
                const pulpitRow = Array(safeCols).fill('');
                pulpitRow[Math.floor((safeCols - 1) / 2)] = '教卓';
                rows.push(pulpitRow);
                rows.push(Array(safeCols).fill(''));
                for (let r = 0; r < safeRows; r++) {
                    const rowData = [];
                    for (let c = 0; c < safeCols; c++) {
                        const idx = r * safeCols + c;
                        const student = layout[idx];
                        const isDisabled = disabledSeats.includes(idx) || student === 'disabled';
                        rowData.push(isDisabled ? '×' : (student && student !== 'disabled' ? student.name : ''));
                    }
                    rows.push(rowData);
                }
                const ws = XLSX.utils.aoa_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, '席替え結果');
                XLSX.writeFile(wb, '席替え表.xlsx');
                showToast('Excelファイルをダウンロードしました', 'success');
            };

            // ★修正①：縦横サイズ変更時に範囲外になった disabledSeats を即座に除去して保存
            const handleConfigChange = (field, value) => {
                if (running) return;
                let num = parseInt(value, 10);
                if (isNaN(num)) num = 1;
                const safeNum = Math.max(1, num);
                const currentVal = data.seatConfig[field];
                if (safeNum > currentVal) {
                    const otherVal = field === 'cols' ? data.seatConfig.rows : data.seatConfig.cols;
                    const limit = Math.max(data.students.length * 2, 60);
                    if (safeNum * otherVal > limit) return;
                }
                const nextRows = field === 'rows' ? safeNum : safeRows;
                const nextCols = field === 'cols' ? safeNum : safeCols;
                const filteredDisabled = sanitizeDisabledSeats(data.seatConfig.disabledSeats, nextRows, nextCols);
                setData(prev => ({
                    ...prev,
                    seatConfig: {
                        ...prev.seatConfig,
                        [field]: safeNum,
                        disabledSeats: filteredDisabled
                    }
                }));
            };

            return (
                <div className="space-y-4">
                    <Card title="席替え" action={
                        <div className="flex gap-2">
                            <Button variant="secondary" onClick={doPrint}><Icons.Printer /> 印刷</Button>
                            <Button variant="secondary" onClick={doExcel}><Icons.Download /> Excel</Button>
                        </div>
                    }>
                        <div className="flex flex-wrap gap-4 mb-4 items-end no-print">
                            <label className="text-sm font-bold text-gray-700">横 <input type="number" disabled={running} className="w-16 border rounded p-1 disabled:bg-gray-100" value={data.seatConfig.cols} onChange={e => handleConfigChange('cols', e.target.value)} /></label>
                            <label className="text-sm font-bold text-gray-700">縦 <input type="number" disabled={running} className="w-16 border rounded p-1 disabled:bg-gray-100" value={data.seatConfig.rows} onChange={e => handleConfigChange('rows', e.target.value)} /></label>
                            <Button onClick={shuffle} disabled={running || isShortage}><Icons.Shuffle /> スタート</Button>
                            <label className="ml-2 flex items-center gap-1 text-sm font-bold text-gray-700 cursor-pointer bg-white px-3 py-2 rounded-lg border shadow-sm hover:bg-gray-50">
                                <input type="checkbox" checked={isAlternateGender} onChange={e => setIsAlternateGender(e.target.checked)} className="w-4 h-4 text-blue-600" />
                                男女交互を強制
                            </label>
                            <div className={'ml-auto font-bold text-sm flex items-center px-3 py-1 rounded-full border ' + (isShortage ? 'bg-red-50 border-red-200' : 'bg-green-50 border-green-200')}>
                                <span className="mr-3 text-gray-600">有効席: {validSeatCount} / 生徒: {studentCount}名</span>
                                {isShortage ? <span className="text-red-500 flex items-center gap-1"><Icons.Alert size={16} /> 席数不足</span> : <span className="text-green-600 flex items-center gap-1"><Icons.Check size={16} /> OK</span>}
                            </div>
                        </div>

                        <div id="print-target" className="p-4 border rounded bg-gray-50 print:border-none print:p-0">
                            <div className="text-center font-bold text-xl mb-4 text-gray-700 print:text-black">教卓</div>
                            <div className="grid gap-2 mx-auto" style={{ gridTemplateColumns: 'repeat(' + safeCols + ', 1fr)' }}>
                                {layout.map((s, i) => {
                                    const isDisabled = disabledSeats.includes(i) || s === 'disabled';
                                    const isBoy = s && s !== 'disabled' && s.gender === 'boy';
                                    const isGirl = s && s !== 'disabled' && s.gender === 'girl';
                                    return (
                                        <div
                                            key={i}
                                            draggable={!running && !isDisabled}
                                            onDragStart={e => onDragStart(e, i)}
                                            onDragOver={onDragOver}
                                            onDrop={e => onDrop(e, i)}
                                            className={'relative aspect-[5/4] border-2 rounded flex items-center justify-center p-1 text-center font-bold text-lg bg-white transition-colors ' +
                                                (isDisabled ? 'bg-gray-200 border-gray-300 opacity-60 ' : isBoy ? 'border-blue-300 ' : isGirl ? 'border-red-300 ' : 'border-gray-300 ') +
                                                (running && !isDisabled ? 'bg-yellow-100' : '')}
                                        >
                                            {!running && (
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); toggleDisableSeat(i); }}
                                                    className={'absolute -top-2 -right-2 bg-white rounded-full shadow border no-print cursor-pointer ' + (isDisabled ? 'text-green-500 border-green-200' : 'text-gray-400 hover:text-red-500')}
                                                    title={isDisabled ? '席を有効にする' : 'この席を使用不可にする'}
                                                >
                                                    {isDisabled ? <Icons.Check size={16} /> : <Icons.X size={16} />}
                                                </button>
                                            )}
                                            {isDisabled ? <Icons.Trash size={24} className="text-gray-400 opacity-20" /> : (s ? s.name : '')}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        // ==========================================
        // 8. 係り・当番ツール
        // ==========================================
        const DutyTool = ({ data, setData, showToast }) => {
            const initialDuties = data.dutyConfig.jobs && data.dutyConfig.jobs.length
                ? data.dutyConfig.jobs.map(j => ({ ...j, genderReq: j.genderReq || 'none', fixedStudentId: j.fixedStudentId || null }))
                : [{ name: '黒板', count: 2, genderReq: 'none', fixedStudentId: null }];

            const [duties, setDuties] = useState(initialDuties);
            const [schedule, setSchedule] = useState([]);
            const [importOpen, setImportOpen] = useState(false);
            const [shiftVal, setShiftVal] = useState(1);

            useEffect(() => {
                setData(prev => ({ ...prev, dutyConfig: { ...prev.dutyConfig, jobs: duties } }));
            }, [duties]);

            const usedStudentIds = new Set(
                duties.filter(d => (d.genderReq === 'fixed' || d.genderReq === 'exempt') && d.fixedStudentId).map(d => d.fixedStudentId)
            );
            const availableStudents = data.students.filter(s => !usedStudentIds.has(s.id));

            const rosterCounts = availableStudents.reduce((acc, s) => {
                acc[s.gender || 'mixed'] = (acc[s.gender || 'mixed'] || 0) + 1;
                return acc;
            }, { boy: 0, girl: 0, mixed: 0 });

            const dutyCounts = duties.reduce((acc, d) => {
                if (d.genderReq === 'fixed' || d.genderReq === 'exempt') return acc;
                if (d.genderReq === 'boy') acc.boy += d.count;
                else if (d.genderReq === 'girl') acc.girl += d.count;
                else acc.none += d.count;
                return acc;
            }, { boy: 0, girl: 0, none: 0 });

            const remainingStudents = availableStudents.length;
            const requiredSlots = dutyCounts.boy + dutyCounts.girl + dutyCounts.none;
            const remainingSlots = remainingStudents - requiredSlots;

            const updateCount = (index, newCount) => {
                if (isNaN(newCount) || newCount < 1) return;
                if (newCount > duties[index].count && remainingSlots <= 0) {
                    showToast('生徒数が不足しています', 'error');
                    return;
                }
                const nd = [...duties];
                nd[index].count = newCount;
                setDuties(nd);
            };

            const updateGender = (index, val) => {
                const nd = [...duties];
                nd[index].genderReq = val;
                if (val === 'fixed' || val === 'exempt') nd[index].count = 1;
                setDuties(nd);
            };

            const updateFixedStudent = (index, sId) => {
                const nd = [...duties];
                nd[index].fixedStudentId = sId;
                setDuties(nd);
            };

            const addJob = () => {
                if (remainingSlots <= 0) return;
                setDuties([...duties, { name: '', count: 1, genderReq: 'none', fixedStudentId: null }]);
            };

            const generate = (sortType) => {
                if (data.students.length === 0) return showToast('生徒がいません', 'error');
                if (rosterCounts.boy < dutyCounts.boy) return showToast('男子が不足しています', 'error');
                if (rosterCounts.girl < dutyCounts.girl) return showToast('女子が不足しています', 'error');
                if (remainingStudents < requiredSlots) return showToast('全体の生徒数が不足しています', 'error');

                const pool = data.students.filter(s => !usedStudentIds.has(s.id));
                if (sortType === 'random') {
                    for (let i = pool.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [pool[i], pool[j]] = [pool[j], pool[i]];
                    }
                } else if (sortType === 'desc') {
                    pool.reverse();
                }

                const boysList = pool.filter(s => s.gender === 'boy');
                const girlsList = pool.filter(s => s.gender === 'girl');
                const allList = [...pool];

                const slotsInfo = [];
                let slotIndex = 0;
                duties.forEach(d => {
                    if (d.genderReq === 'fixed') {
                        slotsInfo.push({ id: 'slot_' + (slotIndex++), name: d.name, genderReq: 'fixed', fixedStudentId: d.fixedStudentId });
                    } else if (d.genderReq !== 'exempt') {
                        for (let i = 0; i < d.count; i++) {
                            slotsInfo.push({ id: 'slot_' + (slotIndex++), name: d.count > 1 ? (d.name + (i + 1)) : d.name, genderReq: d.genderReq });
                        }
                    }
                });

                const weeks = data.dutyConfig.duration || 10;
                const newSchedule = [];
                let cursorBoy = 0, assignCountBoy = 0, offsetBoy = 0;
                let cursorGirl = 0, assignCountGirl = 0, offsetGirl = 0;
                let cursorGlobal = 0, assignCountGlobal = 0, offsetGlobal = 0;

                const getSafeIndex = (index, length) => (length <= 0 ? 0 : ((index % length) + length) % length);

                for (let w = 1; w <= weeks; w++) {
                    const weekAssignments = {};
                    const usedInThisWeek = new Set();

                    const startBoyLaps = boysList.length > 0 ? Math.floor(assignCountBoy / boysList.length) : 0;
                    const startGirlLaps = girlsList.length > 0 ? Math.floor(assignCountGirl / girlsList.length) : 0;
                    const startGlobalLaps = allList.length > 0 ? Math.floor(assignCountGlobal / allList.length) : 0;

                    slotsInfo.forEach(slot => {
                        if (slot.genderReq === 'fixed') {
                            const student = data.students.find(s => s.id === slot.fixedStudentId);
                            weekAssignments[slot.id] = student ? student.name : '(未設定)';
                            if (student) usedInThisWeek.add(student.id);
                        }
                    });

                    slotsInfo.forEach(slot => {
                        if (slot.genderReq !== 'boy') return;
                        let found = false;
                        for (let k = 0; k < boysList.length; k++) {
                            const student = boysList[getSafeIndex(cursorBoy + offsetBoy + k, boysList.length)];
                            if (!usedInThisWeek.has(student.id)) {
                                weekAssignments[slot.id] = student.name;
                                usedInThisWeek.add(student.id);
                                cursorBoy += (k + 1);
                                assignCountBoy++;
                                found = true;
                                break;
                            }
                        }
                        if (!found) weekAssignments[slot.id] = '(不足)';
                    });

                    slotsInfo.forEach(slot => {
                        if (slot.genderReq !== 'girl') return;
                        let found = false;
                        for (let k = 0; k < girlsList.length; k++) {
                            const student = girlsList[getSafeIndex(cursorGirl + offsetGirl + k, girlsList.length)];
                            if (!usedInThisWeek.has(student.id)) {
                                weekAssignments[slot.id] = student.name;
                                usedInThisWeek.add(student.id);
                                cursorGirl += (k + 1);
                                assignCountGirl++;
                                found = true;
                                break;
                            }
                        }
                        if (!found) weekAssignments[slot.id] = '(不足)';
                    });

                    slotsInfo.forEach(slot => {
                        if (slot.genderReq !== 'none') return;
                        let found = false;
                        for (let k = 0; k < allList.length; k++) {
                            const student = allList[getSafeIndex(cursorGlobal + offsetGlobal + k, allList.length)];
                            if (!usedInThisWeek.has(student.id)) {
                                weekAssignments[slot.id] = student.name;
                                usedInThisWeek.add(student.id);
                                cursorGlobal += (k + 1);
                                assignCountGlobal++;
                                found = true;
                                break;
                            }
                        }
                        if (!found) weekAssignments[slot.id] = '-';
                    });

                    if (boysList.length > 0) {
                        const endLaps = Math.floor(assignCountBoy / boysList.length);
                        if (endLaps > startBoyLaps) offsetBoy += -shiftVal * (endLaps - startBoyLaps);
                    }
                    if (girlsList.length > 0) {
                        const endLaps = Math.floor(assignCountGirl / girlsList.length);
                        if (endLaps > startGirlLaps) offsetGirl += -shiftVal * (endLaps - startGirlLaps);
                    }
                    if (allList.length > 0) {
                        const endLaps = Math.floor(assignCountGlobal / allList.length);
                        if (endLaps > startGlobalLaps) offsetGlobal += -shiftVal * (endLaps - startGlobalLaps);
                    }

                    newSchedule.push({ id: w, mapping: weekAssignments });
                }

                setSchedule({ slots: slotsInfo, weeks: newSchedule });
                showToast('当番表を作成しました', 'success');
            };

            const doPrint = () => handlePrint('print-target', showToast);
            const doExcel = () => {
                if (!schedule.slots) return;
                const rows = [['係名', ...schedule.weeks.map(w => w.id + (data.dutyConfig.type === 'week' ? '週' : '月'))]];
                schedule.slots.forEach(slot => {
                    rows.push([slot.name, ...schedule.weeks.map(w => w.mapping[slot.id] || '')]);
                });
                const ws = XLSX.utils.aoa_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '当番表');
                XLSX.writeFile(wb, '当番表.xlsx');
                showToast('Excelファイルをダウンロードしました', 'success');
            };

            return (
                <div className="space-y-6">
                    <PasteModal
                        isOpen={importOpen}
                        onClose={() => setImportOpen(false)}
                        title="係リスト取込"
                        placeholder={'係名\n係名\t人数'}
                        onImport={(txt) => {
                            const ls = txt.split(/\r\n|\n/).filter(l => l.trim());
                            const nd = ls.map(l => {
                                const p = l.split('\t');
                                return { name: p[0].trim(), count: parseInt(p[1], 10) || 1, genderReq: 'none', fixedStudentId: null };
                            });
                            setDuties([...duties, ...nd]);
                        }}
                    />

                    <Card title="係り・当番設定">
                        <div className="space-y-4">
                            <div className="no-print">
                                <div className="flex justify-between mb-2">
                                    <h3 className="font-bold text-gray-700 flex items-center gap-2">
                                        係りの構成
                                        <span className={'text-sm ml-2 ' + (remainingSlots < 0 ? 'text-red-500' : 'text-blue-600')}>
                                            (残り生徒: {remainingSlots}名)
                                        </span>
                                    </h3>
                                    <Button variant="secondary" onClick={() => setImportOpen(true)} className="text-xs py-1"><Icons.ClipboardList /> 取込</Button>
                                </div>
                                <div className="bg-orange-50 p-2 mb-2 rounded text-xs text-orange-800 border border-orange-200">
                                    <span className="font-bold">現在の対象人数 (固定・免除除く):</span> 男子 {rosterCounts.boy}名 / 女子 {rosterCounts.girl}名
                                </div>

                                {duties.map((d, i) => (
                                    <div key={i} className={'flex gap-2 mb-2 items-center p-2 rounded ' + (d.genderReq === 'exempt' ? 'bg-gray-100 border border-gray-300' : '')}>
                                        <input
                                            className="border rounded p-2 flex-grow"
                                            value={d.name}
                                            placeholder={d.genderReq === 'exempt' ? '理由 (例: 入院中)' : '係名'}
                                            onChange={e => {
                                                const nd = [...duties];
                                                nd[i].name = e.target.value;
                                                setDuties(nd);
                                            }}
                                        />
                                        <select
                                            className={'border rounded p-2 w-24 text-sm font-bold ' +
                                                (d.genderReq === 'boy' ? 'bg-blue-50 text-blue-800' :
                                                    d.genderReq === 'girl' ? 'bg-red-50 text-red-800' :
                                                        d.genderReq === 'fixed' ? 'bg-purple-100 text-purple-800' :
                                                            d.genderReq === 'exempt' ? 'bg-gray-200 text-gray-600' : '')}
                                            value={d.genderReq}
                                            onChange={e => updateGender(i, e.target.value)}
                                        >
                                            <option value="none">指定なし</option>
                                            <option value="boy">男子のみ</option>
                                            <option value="girl">女子のみ</option>
                                            <option value="fixed">★固定</option>
                                            <option value="exempt">免除</option>
                                        </select>
                                        {d.genderReq === 'fixed' || d.genderReq === 'exempt' ? (
                                            <select
                                                className={'border rounded p-2 w-40 text-sm ' + (d.genderReq === 'fixed' ? 'bg-purple-50' : 'bg-gray-50')}
                                                value={d.fixedStudentId || ''}
                                                onChange={e => updateFixedStudent(i, e.target.value)}
                                            >
                                                <option value="">生徒を選択...</option>
                                                {data.students.map(s => (
                                                    (s.id === d.fixedStudentId || !usedStudentIds.has(s.id)) ? <option key={s.id} value={s.id}>{s.name}</option> : null
                                                ))}
                                            </select>
                                        ) : (
